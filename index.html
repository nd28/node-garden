<!-- button-app v0.0.27 — on version bump: update #version footer + add entry to CHANGELOG.md -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Round Button</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #fff;
    color: #000;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  #round-btn {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: none;
    background: #000;
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    transition: transform 0.3s ease, opacity 0.3s ease, background 0.15s ease;
  }
  #round-btn:hover { background: #222; transform: scale(1.05); }
  #round-btn:active { transform: scale(0.96); }
  #round-btn.shrink {
    transform: scale(0);
    opacity: 0;
    pointer-events: none;
  }
  /* Stage: vertical stack centered (pager + nodes + add). Not scrollable. */
  #stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    max-height: 100vh;
    overflow: visible;
  }
  #nodes {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    overflow: visible;
  }
  #nodes.show-4 { gap: 8px; }
  .root-node {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 200px;
    min-height: 80px;
  }
  #nodes.show-4 .root-node { min-height: 60px; }
  .root-input {
    display: none;
    border: none;
    outline: none;
    background: transparent;
    font-size: 2rem;
    text-align: center;
    min-width: 200px;
    caret-color: #000;
    color: #000;
    text-transform: none;
    transform: scale(0);
    opacity: 0;
  }
  #nodes.show-4 .root-input { font-size: 1.6rem; }
  /* Thick fake caret (4px): native caret hidden via JS -> transparent,
     this block bar follows the true caret position. Mono only. Shared one. */
  #fake-caret {
    position: fixed;
    display: none;
    width: 4px;
    height: 38px;
    background: #000;
    pointer-events: none;
    z-index: 10;
    animation: caretBlink 1.06s steps(1) infinite;
  }
  #fake-caret.on { display: block; }
  @keyframes caretBlink {
    0%, 45% { opacity: 1; }
    50%, 95% { opacity: 0; }
    100% { opacity: 1; }
  }
  .root-input.show {
    display: block;
    animation: grow 0.3s ease forwards;
  }
  @keyframes grow {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .root-input.edit-pop {
    display: block;
    animation: editUnblur 0.25s ease forwards;
  }
  /* Empty-validation shake: uses `translate` (not `transform`) so it never
     fights the grow/edit-pop scale animations. Re-triggered from JS. */
  .root-input.shake { animation: inputShake 0.3s ease; }
  @keyframes inputShake {
    0%, 100% { translate: 0 0; }
    25% { translate: -6px 0; }
    50% { translate: 6px 0; }
    75% { translate: -3px 0; }
  }
  @keyframes editUnblur {
    from { filter: blur(8px); opacity: 0; transform: scale(1); }
    50% { filter: blur(4px); opacity: 1; transform: scale(1.05); }
    to { filter: blur(0); opacity: 1; transform: scale(1); }
  }
  .root-input.fade-blur-out {
    display: block;
    animation: editBlurOut 0.25s ease forwards;
  }
  @keyframes editBlurOut {
    from { filter: blur(0); opacity: 1; transform: scale(1); }
    to { filter: blur(8px); opacity: 0; transform: scale(1); }
  }
  .solid-wrap {
    display: none;
    position: relative;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 200px;
    min-height: 80px;
  }
  #nodes.show-4 .solid-wrap { min-height: 60px; }
  .solid-wrap.show { display: flex; }
  .ripple {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 120px;
    height: 120px;
    margin: -60px 0 0 -60px;
    border-radius: 50%;
    background: rgba(0,0,0,0.18);
    transform: scale(0);
    opacity: 0;
    pointer-events: none;
  }
  .solid-wrap.show .ripple { animation: ripple 0.6s ease-out; }
  @keyframes ripple {
    from { transform: scale(0); opacity: 0.8; }
    to { transform: scale(2); opacity: 0; }
  }
  .solid-text {
    position: relative;
    display: inline-flex;
    align-items: center;
    vertical-align: middle;
    margin: 0;
    padding: 0;
    font-size: 2rem;
    line-height: 1;
    text-align: center;
    color: #000;
    letter-spacing: 0.04em;
    text-shadow: 0 1px 0 #fff, 0 -1px 1px rgba(0,0,0,0.3);
    cursor: pointer;
    user-select: none;
    transition: filter 0.25s ease, opacity 0.25s ease, transform 0.18s ease, text-shadow 0.18s ease;
  }
  #nodes.show-4 .solid-text { font-size: 1.6rem; }
  .solid-text.blur-out {
    filter: blur(8px);
    opacity: 0;
  }
  .solid-text.solid-unblur {
    animation: solidUnblur 0.25s ease forwards;
  }
  @keyframes solidUnblur {
    from { filter: blur(8px); opacity: 0; }
    50% { filter: blur(4px); opacity: 1; }
    to { filter: blur(0); opacity: 1; }
  }
  .solid-text .letter {
    display: inline-block;
    line-height: 1;
    vertical-align: middle;
    font-weight: 400;
    animation: thicken-press 0.45s ease forwards;
  }
  @keyframes thicken-press {
    from {
      font-weight: 400;
      transform: scale(1.18);
      text-shadow: 0 2px 2px rgba(0,0,0,0.2), 0 0 0 #fff;
    }
    to {
      font-weight: 800;
      transform: scale(1);
      text-shadow: 0 1px 0 #fff, 0 -1px 1px rgba(0,0,0,0.3);
    }
  }
  /* Pager buttons: small mono rounded arrows. */
  .pager-btn {
    width: 36px;
    height: 28px;
    border-radius: 10px;
    border: 1px solid #000;
    background: #000;
    color: #fff;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .pager-btn:hover { background: #222; }
  .pager-btn:active { transform: scale(0.94); }
  /* Add-node button: ~24px, rounded 8px, "+" text, random bounce via JS. Mono only. */
  #add-node-btn {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    border: 1px solid #000;
    background: #000;
    color: #fff;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    transition: transform 0.7s ease, background 0.15s ease;
  }
  #add-node-btn:hover { background: #222; }
  #add-node-btn:active { transform: scale(0.94); }
  /* Level nav (v0.0.27): Home + Back row below + button, inside only. */
  #level-nav {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #home-btn, #level-back-btn {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    border: 1px solid #000;
    background: #000;
    color: #fff;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  #home-btn:hover, #level-back-btn:hover { background: #222; }
  #home-btn:active, #level-back-btn:active { transform: scale(0.94); }
  /* Drill nav: back + crumbs (mono) + level title (system font, parent word only). */
  #nav-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    max-width: 92vw;
  }
  #back-btn {
    width: auto;
    min-width: 36px;
    height: 28px;
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid #000;
    background: #000;
    color: #fff;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  #back-btn:hover { background: #222; }
  #back-btn:active { transform: scale(0.94); }
  #crumbs {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 92vw;
  }
  .crumb-btn {
    padding: 2px 8px;
    border-radius: 8px;
    border: 1px solid #000;
    background: transparent;
    color: #000;
    font-size: 12px;
    line-height: 1.4;
    cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .crumb-btn:hover { background: #000; color: #fff; }
  .crumb-btn.current {
    font-weight: 800;
    cursor: default;
    background: #000;
    color: #fff;
  }
  .crumb-sep { opacity: 0.45; font-size: 12px; }
  #level-title {
    font-size: 13px;
    letter-spacing: 0.04em;
    font-family: system-ui, sans-serif;
    opacity: 0.8;
    max-width: 92vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Open-child affordance: small mono › pill next to solid text. */
  .open-btn {
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
    align-self: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    border-radius: 6px;
    border: 1px solid #000;
    background: #000;
    color: #fff;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .open-btn:hover { background: #222; }
  .open-btn:active { transform: scale(0.94); }
  #status { position: fixed; bottom: 24px; color: #555; }
  #version { position: fixed; bottom: 8px; right: 12px; font-size: 11px; color: #888; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #version a { color: inherit; text-decoration: none; font-family: inherit; }
  #version a:hover { text-decoration: underline; }
  /* Alt-key ID peek badges: mono pills, fixed near target. */
  .id-badge {
    position: fixed;
    z-index: 9999;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    line-height: 1;
    padding: 3px 7px;
    border-radius: 8px;
    background: #000;
    color: #fff;
    border: 1px solid #000;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .id-badge:hover { background: #222; }
  .id-badge.copied { background: #fff; color: #000; }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #fff; }
    #round-btn { background: #fff; color: #000; box-shadow: 0 4px 14px rgba(255,255,255,0.2); }
    #round-btn:hover { background: #ddd; }
    .root-input { color: #fff; caret-color: #fff; }
    .root-input::placeholder { color: #888; }
    #fake-caret { background: #fff; }
    .ripple { background: rgba(255,255,255,0.18); }
    .solid-text {
      color: #fff;
      text-shadow: 0 -1px 0 #000, 0 1px 1px rgba(255,255,255,0.3);
    }
    .solid-text .letter { animation-name: thicken-press-dark; }
    @keyframes thicken-press-dark {
      from {
        font-weight: 400;
        transform: scale(1.18);
        text-shadow: 0 2px 2px rgba(255,255,255,0.2), 0 0 0 #000;
      }
      to {
        font-weight: 800;
        transform: scale(1);
        text-shadow: 0 -1px 0 #000, 0 1px 1px rgba(255,255,255,0.3);
      }
    }
    .pager-btn { background: #fff; color: #000; border-color: #fff; }
    .pager-btn:hover { background: #ddd; }
    #add-node-btn { background: #fff; color: #000; border-color: #fff; }
    #add-node-btn:hover { background: #ddd; }
    #home-btn, #level-back-btn { background: #fff; color: #000; border-color: #fff; }
    #home-btn:hover, #level-back-btn:hover { background: #ddd; }
    #back-btn { background: #fff; color: #000; border-color: #fff; }
    #back-btn:hover { background: #ddd; }
    .crumb-btn { border-color: #fff; color: #fff; }
    .crumb-btn:hover { background: #fff; color: #000; }
    .crumb-btn.current { background: #fff; color: #000; }
    .open-btn { background: #fff; color: #000; border-color: #fff; }
    .open-btn:hover { background: #ddd; }
    #status { color: #999; }
    #version { color: #888; }
    .id-badge { background: #fff; color: #000; border-color: #fff; }
    .id-badge:hover { background: #ddd; }
    .id-badge.copied { background: #000; color: #fff; border-color: #fff; }
  }
</style>
</head>
<body>
  <button id="round-btn" style="display:none">Write</button>
  <div id="stage">
    <div id="nav-bar">
      <button id="back-btn" aria-label="Back to parent" title="Back to parent" style="display:none">&larr; Back</button>
      <nav id="crumbs" aria-label="Breadcrumb"></nav>
      <div id="level-title" aria-live="polite"></div>
    </div>
    <button id="page-up" class="pager-btn" aria-label="Previous page" style="display:none">&#9650;</button>
    <div id="nodes" aria-live="polite"></div>
    <button id="page-down" class="pager-btn" aria-label="Next page" style="display:none">&#9660;</button>
    <button id="add-node-btn" aria-label="Add root node" title="Add root node">+</button>
    <div id="level-nav" style="display:none">
      <button id="home-btn" aria-label="Back to roots" title="Back to roots">&#8962;</button>
      <button id="level-back-btn" aria-label="Back to parent" title="Back to parent">&#8249;</button>
    </div>
  </div>
  <div id="fake-caret" aria-hidden="true"></div>
  <p id="status">Waiting for writing...</p>
  <div id="version"><a href="CHANGELOG.md" title="Changelog">v0.0.27</a></div>
  <script>
    const nodesEl = document.getElementById('nodes');
    const addBtn = document.getElementById('add-node-btn');
    const pageUp = document.getElementById('page-up');
    const pageDown = document.getElementById('page-down');
    const status = document.getElementById('status');
    const fakeCaret = document.getElementById('fake-caret');
    const caretMeas = document.createElement('canvas').getContext('2d');
    const LS_GRAPH = 'root-graph-json';
    const LS_NEW = 'root-nodes-json';
    const LS_OLD = 'root-node-word';

    // Feature flags (v0.0.22): toggle experiments here. Ripple is OFF by default.
    // Override via localStorage: localStorage.setItem('feat-ripple', '1') to force on, '0' to force off.
    const FEATURES = { ripple: false };
    function shouldRipple() {
      try {
        const v = localStorage.getItem('feat-ripple');
        if (v !== null) return v === '1' || v === 'true';
      } catch (_) {}
      return !!FEATURES.ripple;
    }
    if (!shouldRipple()) console.log('[features] ripple off');

    function toTitleCase(s) {
      return s.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
    }
    // Empty-node validation (v0.0.19): a word needs >=1 visible char,
    // capped at MAX_WORD_LEN. Used by Enter/blur solidify + add button.
    const MAX_WORD_LEN = 60;
    function isValidWord(word) {
      const t = String(word || '').trim();
      return t.length >= 1 && t.length <= MAX_WORD_LEN;
    }
    function shakeInput(input) {
      if (!input) return;
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('shake');
      setTimeout(() => { input.classList.remove('shake'); }, 350);
      requestAnimationFrame(updateCaret);
    }
    function rejectEmpty(input) {
      shakeInput(input);
      try { input.focus(); } catch (_) {}
      const pw = parentWord();
      status.textContent = 'Type a word first' + (pw ? ' in ' + pw : '');
      requestAnimationFrame(updateCaret);
    }
    function rejectTooLong(input) {
      shakeInput(input);
      try { input.focus(); } catch (_) {}
      status.textContent = 'Keep it under 60 chars';
      requestAnimationFrame(updateCaret);
    }
    function newNodeId() {
      try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (_) {}
      return 'n-' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e9).toString(36);
    }

    // Tree Graph store (v0.0.20, v2 JSON): each node
    // {id, word, parentId (null = root), createdAt, order}.
    // order: [id] global insertion order; sibling order derives from
    // filtering order by parentId. Edges are parent->child only.
    // Persisted as {version: 2, nodes, edges, order}; v1 flat files
    // (no parentId, linear chain edges) migrate to parentId=null.
    const GRAPH_VERSION = 2;
    class Graph {
      constructor() {
        this.nodes = new Map();
        this.adj = new Map();
        this.order = [];
      }
      get size() { return this.order.length; }
      addNode(word, parentId) {
        const w = word || '';
        const pid = (parentId !== undefined && parentId !== null && this.nodes.has(parentId))
          ? parentId : null;
        const id = newNodeId();
        const node = { id, word: w, parentId: pid, createdAt: Date.now(), order: this.order.length };
        this.nodes.set(id, node);
        this.adj.set(id, new Set());
        if (pid) this.addEdge(pid, id);
        this.order.push(id);
        return id;
      }
      updateNode(id, word) {
        const n = this.nodes.get(id);
        if (!n) return;
        n.word = word;
      }
      removeNode(id) {
        if (!this.nodes.has(id)) return false;
        // Cascade: collect id + all descendants via parentId links.
        const doomed = new Set([id]);
        let grew = true;
        while (grew) {
          grew = false;
          for (const [nid, n] of this.nodes) {
            if (!doomed.has(nid) && n.parentId && doomed.has(n.parentId)) {
              doomed.add(nid);
              grew = true;
            }
          }
        }
        for (const d of doomed) {
          this.nodes.delete(d);
          this.adj.delete(d);
        }
        for (const set of this.adj.values()) {
          for (const d of doomed) set.delete(d);
        }
        this.order = this.order.filter((x) => !doomed.has(x));
        for (let i = 0; i < this.order.length; i++) {
          const n = this.nodes.get(this.order[i]);
          if (n) n.order = i;
        }
        return true;
      }
      getNode(id) { return this.nodes.get(id) || null; }
      getOrderedNodes() {
        const out = [];
        for (const id of this.order) {
          const n = this.nodes.get(id);
          if (n) out.push(n);
        }
        return out;
      }
      // Siblings in stable insertion order for one parent level.
      getChildren(parentId) {
        const pid = parentId || null;
        const out = [];
        for (const id of this.order) {
          const n = this.nodes.get(id);
          if (n && (n.parentId || null) === pid) out.push(n);
        }
        return out;
      }
      childCount(parentId) { return this.getChildren(parentId).length; }
      // Ancestor chain root->...->parent of id (excludes id itself).
      pathTo(id) {
        const chain = [];
        const seen = new Set();
        let cur = id ? this.getNode(id) : null;
        cur = cur ? this.getNode(cur.parentId) : null;
        const rev = [];
        while (cur && !seen.has(cur.id)) {
          seen.add(cur.id);
          rev.push(cur);
          cur = cur.parentId ? this.getNode(cur.parentId) : null;
        }
        for (let i = rev.length - 1; i >= 0; i--) chain.push(rev[i]);
        return chain;
      }
      addEdge(fromId, toId) {
        if (!this.nodes.has(fromId) || !this.nodes.has(toId)) return;
        if (!this.adj.has(fromId)) this.adj.set(fromId, new Set());
        this.adj.get(fromId).add(toId);
      }
      getEdges() {
        const edges = [];
        for (const [from, set] of this.adj) {
          for (const to of set) edges.push({ from, to });
        }
        return edges;
      }
      toJSON() {
        return { version: GRAPH_VERSION, nodes: [...this.nodes.values()], edges: this.getEdges(), order: [...this.order] };
      }
      static fromJSON(obj) {
        if (!obj || !Array.isArray(obj.nodes) || !Array.isArray(obj.order)) return null;
        const isV2 = obj.version === 2 || obj.nodes.some((n) => n && Object.prototype.hasOwnProperty.call(n, 'parentId'));
        const g = new Graph();
        const byId = new Map();
        for (const n of obj.nodes) {
          if (!n || typeof n.id !== 'string') continue;
          byId.set(n.id, n);
        }
        g.order = [];
        for (let i = 0; i < obj.order.length; i++) {
          const id = obj.order[i];
          const n = byId.get(id);
          if (!n) continue;
          const rawPid = (isV2 && typeof n.parentId === 'string') ? n.parentId : null;
          g.nodes.set(id, {
            id,
            word: String(n.word || ''),
            parentId: rawPid,
            createdAt: Number(n.createdAt) || Date.now(),
            order: g.order.length,
          });
          g.adj.set(id, new Set());
          g.order.push(id);
        }
        if (g.order.length === 0) return null;
        // Drop dangling parent refs (flat v1 -> null).
        for (const n of g.nodes.values()) {
          if (n.parentId && !g.nodes.has(n.parentId)) n.parentId = null;
        }
        if (isV2 && Array.isArray(obj.edges)) {
          for (const e of obj.edges) {
            const f = e && (e.from !== undefined ? e.from : e[0]);
            const t = e && (e.to !== undefined ? e.to : e[1]);
            if (typeof f === 'string' && typeof t === 'string') g.addEdge(f, t);
          }
        }
        // Ensure every non-root has its parent->child edge.
        for (const n of g.nodes.values()) {
          if (n.parentId) g.addEdge(n.parentId, n.id);
        }
        return g;
      }
    }

    let graph = new Graph();
    let page = 0;
    // Drill state: null = roots, else node id whose children are shown.
    let currentParentId = null;

    // Store helpers used by render/paging/add/edit (all per current level).
    function getOrderedNodes() { return graph.getChildren(currentParentId); }
    function currentList() { return graph.getChildren(currentParentId); }
    function currentSize() { return graph.childCount(currentParentId); }
    function getParentNode() { return currentParentId ? graph.getNode(currentParentId) : null; }
    function parentWord() {
      const p = getParentNode();
      return p ? (p.word || '').trim() : '';
    }
    function crumbPath() {
      if (!currentParentId) return [];
      const p = graph.getNode(currentParentId);
      if (!p) return [];
      return [...graph.pathTo(currentParentId), p];
    }
    function addNode(word) { return graph.addNode(word, currentParentId); }
    function updateNode(id, word) { return graph.updateNode(id, word); }
    function nodeIdAt(idx) {
      const list = currentList();
      return list[idx] ? list[idx].id : undefined;
    }
    function getWordAt(idx) {
      const n = graph.getNode(nodeIdAt(idx));
      return n ? n.word : '';
    }
    function setWordAt(idx, word) {
      const id = nodeIdAt(idx);
      if (id !== undefined) graph.updateNode(id, word);
    }
    function saveGraph() {
      try { localStorage.setItem(LS_GRAPH, JSON.stringify(graph.toJSON())); } catch (_) {}
    }
    function saveNodes() { saveGraph(); }
    // Prune empty leaves (v0.0.26): any node with trim=='' AND zero children
    // auto-removes. Empty nodes WITH children are structural parents — kept.
    // Per level steady state: >=1 non-empty -> zero empties (no waiting until
    // + pressed); zero nodes -> one empty waiting (so typing stays possible).
    // opts.preserveCurrent: skip the current view level (transient + typing /
    // paging must survive render). Load/navigate use full prune.
    // Iterative: removing a leaf can expose its empty parent as a new leaf.
    function pruneEmptiesToOne(opts) {
      const preserveCurrent = !!(opts && opts.preserveCurrent);
      const skipPid = preserveCurrent ? (currentParentId || null) : undefined;
      let changed = false;
      let loop = true;
      while (loop) {
        loop = false;
        const ordered = graph.getOrderedNodes();
        const nonEmptyByParent = new Map();
        for (const m of ordered) {
          if (!graph.getNode(m.id)) continue;
          if ((m.word || '').trim()) {
            const kk = m.parentId || '\0roots';
            nonEmptyByParent.set(kk, (nonEmptyByParent.get(kk) || 0) + 1);
          }
        }
        const keptProtected = new Set();
        for (const n of ordered) {
          if (!graph.getNode(n.id)) continue;
          if ((n.word || '').trim()) continue;
          if (graph.getChildren(n.id).length !== 0) continue;
          const pid = n.parentId || null;
          if (skipPid !== undefined && pid === skipPid) continue;
          const pkey = n.parentId || '\0roots';
          const isProtected = pid === null || pid === (currentParentId || null);
          const hasNonEmpty = (nonEmptyByParent.get(pkey) || 0) > 0;
          if (hasNonEmpty) {
            graph.removeNode(n.id); changed = true; loop = true;
          } else if (isProtected) {
            if (!keptProtected.has(pkey)) keptProtected.add(pkey);
            else { graph.removeNode(n.id); changed = true; loop = true; }
          } else {
            graph.removeNode(n.id); changed = true; loop = true;
          }
        }
      }
      if (skipPid !== null || !preserveCurrent) {
        if (graph.childCount(null) === 0) { graph.addNode('', null); changed = true; }
      }
      if (currentParentId && graph.getNode(currentParentId)) {
        if (skipPid !== currentParentId && graph.childCount(currentParentId) === 0) {
          graph.addNode('', currentParentId); changed = true;
        }
      }
      if (changed) saveGraph();
      return changed;
    }
    // Ensure a level shows at least one waiting input when empty.
    function ensureLevelHasNode(parentId) {
      if (graph.childCount(parentId || null) === 0) {
        graph.addNode('', parentId || null);
        saveGraph();
        return true;
      }
      return false;
    }
    // Remove a single empty leaf by id (v0.0.26: trim=='' AND zero children).
    // Empty WITH children is structural — kept (needs a word, shake on commit).
    // Keeps the sole node of an empty level so typing stays possible.
    function pruneEmptyNodeById(id) {
      const n = id ? graph.getNode(id) : null;
      if (!n) return false;
      if ((n.word || '').trim()) return false;
      if (graph.getChildren(id).length !== 0) return false;
      const pid = n.parentId || null;
      const sibs = graph.childCount(pid);
      if (sibs <= 1) {
        graph.updateNode(id, '');
        saveGraph();
        updateStatus();
        return false;
      }
      const wasCurrentLevel = pid === (currentParentId || null);
      graph.removeNode(id);
      if (graph.childCount(pid) === 0 && (pid === null || pid === currentParentId)) {
        graph.addNode('', pid);
      }
      saveGraph();
      if (wasCurrentLevel) { clampPage(); render(); }
      return true;
    }
    // Empty-commit helper (v0.0.26): Enter/blur with trim=='' on a childless
    // leaf auto-removes when siblings exist (no shake); sole waiting input or
    // structural parent (has children) keeps validation shake. Returns true
    // when the node was removed (caller must return early, no shake).
    function autoRemoveEmptyLeaf(nid) {
      const nd = nid ? graph.getNode(nid) : null;
      if (!nd) return false;
      if ((nd.word || '').trim()) return false;
      if (graph.getChildren(nid).length !== 0) return false;
      const pid = nd.parentId || null;
      if (graph.childCount(pid) <= 1) return false;
      const wasCurrent = pid === (currentParentId || null);
      graph.removeNode(nid);
      if (graph.childCount(pid) === 0 && (pid === null || pid === currentParentId)) {
        graph.addNode('', pid);
      }
      saveGraph();
      if (wasCurrent) { clampPage(); render(); } else { updateStatus(); }
      return true;
    }
    function loadGraph() {
      // Prefer graph key (v2 tree or v1 flat -> migrated).
      try {
        const raw = localStorage.getItem(LS_GRAPH);
        if (raw !== null) {
          const g = Graph.fromJSON(JSON.parse(raw));
          if (g) { graph = g; return; }
        }
      } catch (_) {}
      // Migrate legacy list key 'root-nodes-json' -> roots.
      try {
        const raw = localStorage.getItem(LS_NEW);
        if (raw !== null) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) {
            const g = new Graph();
            const words = arr.map((x) => toTitleCase(String(x || '').trim()));
            for (const w of words) g.addNode(w, null);
            if (g.childCount(null) === 0) g.addNode('', null);
            graph = g;
            saveGraph();
            return;
          }
        }
      } catch (_) {}
      // Migrate old single key 'root-node-word'.
      try {
        const old = localStorage.getItem(LS_OLD);
        if (old !== null) {
          const g = new Graph();
          const w = toTitleCase((old || '').trim());
          g.addNode(w || '', null);
          graph = g;
          saveGraph();
          try { localStorage.removeItem(LS_OLD); } catch (_) {}
          return;
        }
      } catch (_) {}
      graph = new Graph();
      graph.addNode('', null);
    }
    function loadNodes() {
      loadGraph();
      if (currentParentId && !graph.getNode(currentParentId)) currentParentId = null;
      pruneEmptiesToOne();
    }

    // Paging: pages of 3, but if total<=4 show all (adjust layout to fit 4).
    // If total>=5: chunk 3 while remaining>4, last chunk takes remainder
    // (2, 3, or 4). So remainder==1 merges into a final 4.
    // e.g. 7 -> [3,4]; 9 -> [3,3,3]; 10 -> [3,3,4].
    function computePages(total) {
      if (total <= 0) return [[]];
      if (total <= 4) {
        const one = [];
        for (let i = 0; i < total; i++) one.push(i);
        return [one];
      }
      const pages = [];
      let start = 0;
      while (start < total) {
        const rem = total - start;
        if (rem > 4) {
          pages.push([start, start + 1, start + 2]);
          start += 3;
        } else {
          const last = [];
          for (let i = start; i < total; i++) last.push(i);
          pages.push(last);
          break;
        }
      }
      return pages;
    }
    function clampPage() {
      const pages = computePages(currentSize());
      if (page < 0) page = 0;
      if (page > pages.length - 1) page = pages.length - 1;
      return pages;
    }

    // Shared thick (4px) fake caret for whichever .root-input is focused.
    function caretTextWidth(input, text) {
      const cs = getComputedStyle(input);
      caretMeas.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      return caretMeas.measureText(text || '').width;
    }
    function updateCaret() {
      const input = document.activeElement;
      if (!input || !input.classList || !input.classList.contains('root-input')) {
        fakeCaret.classList.remove('on');
        return;
      }
      const visible = input.classList.contains('show') || input.classList.contains('edit-pop');
      if (!visible) { fakeCaret.classList.remove('on'); return; }
      let pos = 0;
      try { pos = input.selectionStart || 0; } catch (_) { pos = (input.value || '').length; }
      try { if (input.selectionStart !== input.selectionEnd) { fakeCaret.classList.remove('on'); return; } } catch (_) {}
      const rect = input.getBoundingClientRect();
      if (rect.width === 0) { fakeCaret.classList.remove('on'); return; }
      const val = input.value || '';
      const fullW = caretTextWidth(input, val);
      const preW = caretTextWidth(input, val.slice(0, pos));
      const clientW = input.clientWidth || rect.width;
      let x;
      if (fullW <= clientW) {
        x = rect.left + (rect.width - fullW) / 2 + preW;
      } else {
        x = rect.left + preW - (input.scrollLeft || 0);
      }
      const h = Math.round(rect.height * 0.85) || 34;
      fakeCaret.style.height = h + 'px';
      fakeCaret.style.left = Math.round(x - 2) + 'px';
      fakeCaret.style.top = Math.round(rect.top + (rect.height - h) / 2) + 'px';
      fakeCaret.classList.add('on');
    }
    function hideCaretDelayed() {
      fakeCaret.classList.remove('on');
      setTimeout(() => requestAnimationFrame(updateCaret), 320);
    }

    const backBtn = document.getElementById('back-btn');
    const crumbsEl = document.getElementById('crumbs');
    const levelTitle = document.getElementById('level-title');
    const navBar = document.getElementById('nav-bar');
    const levelNav = document.getElementById('level-nav');
    const homeBtn = document.getElementById('home-btn');
    const levelBackBtn = document.getElementById('level-back-btn');

    function updateStatus() {
      const pages = computePages(currentSize());
      const vis = pages[page] || [];
      const anyEmpty = vis.some((i) => !(getWordAt(i) || '').trim());
      const editing = document.activeElement &&
        document.activeElement.classList &&
        document.activeElement.classList.contains('root-input');
      const pw = parentWord();
      const inCtx = pw ? ' in ' + pw : '';
      const inPrefix = pw ? 'In ' + pw + ': ' : '';
      if (editing) {
        status.textContent = 'Editing' + inCtx + '... press Enter';
      } else if (anyEmpty) {
        status.textContent = 'Waiting for writing' + inCtx + '... press Enter';
      } else {
        status.textContent = inPrefix + 'Click text to edit';
      }
    }

    // Drill navigation: currentParentId=null shows roots.
    function navigateTo(parentId) {
      const pid = parentId || null;
      if (pid && !graph.getNode(pid)) return;
      currentParentId = pid;
      page = 0;
      pruneEmptiesToOne();
      ensureLevelHasNode(currentParentId);
      saveGraph();
      render('first-empty-visible');
      requestAnimationFrame(() => {
        const emptyEl = [...nodesEl.querySelectorAll('.root-node')].find((el) => {
          const i = Number(el.dataset.idx);
          return !(getWordAt(i) || '').trim();
        });
        if (emptyEl) {
          const input = emptyEl.querySelector('.root-input');
          if (input) { input.focus(); hideCaretDelayed(); }
        }
        updateStatus();
      });
    }
    function goBack() {
      const p = getParentNode();
      navigateTo(p ? (p.parentId || null) : null);
    }

    function updateNav() {
      const p = getParentNode();
      // Back button + header (parent word only, no count, no Root).
      backBtn.style.display = p ? '' : 'none';
      if (p) {
        const pw = (p.word || '').trim() || '(empty)';
        levelTitle.textContent = pw;
        levelTitle.style.display = '';
      } else {
        levelTitle.textContent = '';
        levelTitle.style.display = 'none';
      }
      // Breadcrumb: parent-word trail only when inside, hidden at root.
      crumbsEl.innerHTML = '';
      const mkCrumb = (label, targetId, isCurrent, crumbIdx) => {
        const b = document.createElement('button');
        b.className = 'crumb-btn' + (isCurrent ? ' current' : '');
        b.type = 'button';
        b.textContent = label;
        b.dataset.crumb = String(crumbIdx);
        if (isCurrent) {
          b.disabled = true;
          b.setAttribute('aria-current', 'page');
        } else {
          b.title = targetId ? 'Open ' + label : 'Back to roots';
          b.setAttribute('aria-label', targetId ? 'Open ' + label : 'Back to roots');
          b.addEventListener('click', () => navigateTo(targetId));
        }
        return b;
      };
      const mkSep = () => {
        const s = document.createElement('span');
        s.className = 'crumb-sep';
        s.textContent = '/';
        return s;
      };
      if (!p) {
        crumbsEl.style.display = 'none';
        if (navBar) navBar.style.display = 'none';
      } else {
        crumbsEl.style.display = '';
        if (navBar) navBar.style.display = '';
        const chain = crumbPath(); // [...ancestors, current]
        chain.forEach((node, k) => {
          const isCur = k === chain.length - 1;
          const label = (node.word || '').trim() || '(empty)';
          crumbsEl.appendChild(mkCrumb(label, node.id, isCur, k));
          if (!isCur) crumbsEl.appendChild(mkSep());
        });
      }
      // Contextual add button + placeholder hint.
      const pw2 = parentWord();
      // Level nav row (v0.0.27): Home + Back below + button, inside only.
      if (levelNav) levelNav.style.display = p ? '' : 'none';
      if (p) {
        addBtn.setAttribute('aria-label', 'Add child to ' + (pw2 || 'parent'));
        addBtn.title = 'Add to ' + (pw2 || 'parent');
      } else {
        addBtn.setAttribute('aria-label', 'Add root node');
        addBtn.title = 'Add root node';
      }
    }

    function showInput(nodeEl, fromEdit) {
      const input = nodeEl.querySelector('.root-input');
      const wrap = nodeEl.querySelector('.solid-wrap');
      const openBtn = nodeEl.querySelector('.open-btn');
      if (openBtn) openBtn.style.display = 'none';
      wrap.classList.remove('show');
      if (fromEdit) {
        input.classList.remove('show');
        input.classList.remove('edit-pop');
        input.classList.remove('fade-blur-out');
        void input.offsetWidth;
        input.classList.add('edit-pop');
      } else {
        input.classList.remove('edit-pop');
        input.classList.remove('fade-blur-out');
        input.classList.add('show');
      }
      input.focus();
      try { input.setSelectionRange(input.value.length, input.value.length); } catch (_) {}
      hideCaretDelayed();
      updateStatus();
    }

    function showSolid(nodeEl, idx, word) {
      if (nodeEl._solidifying) return;
      const input = nodeEl.querySelector('.root-input');
      const inputVisible = input.classList.contains('show') || input.classList.contains('edit-pop');
      if (inputVisible) {
        nodeEl._solidifying = true;
        input.classList.remove('show');
        input.classList.remove('edit-pop');
        void input.offsetWidth;
        input.classList.add('fade-blur-out');
        setTimeout(() => {
          input.classList.remove('fade-blur-out');
          nodeEl._solidifying = false;
          showSolidNow(nodeEl, idx, word);
        }, 250);
      } else {
        showSolidNow(nodeEl, idx, word);
      }
    }

    function showSolidNow(nodeEl, idx, word, opts) {
      const animate = !opts || opts.animate !== false;
      setWordAt(idx, word);
      saveGraph();
      const input = nodeEl.querySelector('.root-input');
      const wrap = nodeEl.querySelector('.solid-wrap');
      const solid = nodeEl.querySelector('.solid-text');
      const ripple = nodeEl.querySelector('.ripple');
      const openBtn = nodeEl.querySelector('.open-btn');
      fakeCaret.classList.remove('on');
      input.classList.remove('show');
      input.classList.remove('edit-pop');
      input.classList.remove('fade-blur-out');
      solid.innerHTML = '';
      [...word].forEach((ch) => {
        const sp = document.createElement('span');
        sp.className = 'letter';
        sp.textContent = ch === ' ' ? '\u00A0' : ch;
        if (!animate) {
          sp.style.animation = 'none';
          sp.style.fontWeight = '800';
        }
        solid.appendChild(sp);
      });
      solid.classList.remove('blur-out');
      solid.classList.remove('solid-unblur');
      wrap.classList.remove('show');
      if (openBtn) {
        openBtn.style.display = '';
        openBtn.setAttribute('aria-label', 'Open ' + word);
        openBtn.title = 'Open ' + word;
      }
      if (animate) {
        if (shouldRipple()) {
          ripple.style.display = '';
          ripple.style.animation = 'none';
          void ripple.offsetWidth;
          ripple.style.animation = '';
        } else {
          ripple.style.animation = 'none';
          ripple.style.display = 'none';
        }
        void wrap.offsetWidth;
        wrap.classList.add('show');
        void solid.offsetWidth;
        solid.classList.add('solid-unblur');
      } else {
        ripple.style.animation = 'none';
        ripple.style.display = shouldRipple() ? '' : 'none';
        wrap.classList.add('show');
      }
      updateNav();
      updateStatus();
    }

    function createNodeEl(idx) {
      const nodeEl = document.createElement('div');
      nodeEl.className = 'root-node';
      nodeEl.dataset.idx = String(idx);
      const nid = nodeIdAt(idx);
      if (nid) nodeEl.dataset.nodeId = nid;

      const pw0 = parentWord();
      const input = document.createElement('input');
      input.className = 'root-input';
      input.type = 'text';
      input.placeholder = pw0 ? 'Add to ' + pw0 + '...' : '';
      input.autocomplete = 'off';
      input.maxLength = MAX_WORD_LEN;
      input.value = getWordAt(idx) || '';
      input.style.caretColor = 'transparent';

      const wrap = document.createElement('div');
      wrap.className = 'solid-wrap';
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      const solid = document.createElement('div');
      solid.className = 'solid-text';
      solid.title = 'Click to edit';
      const openBtn = document.createElement('button');
      openBtn.className = 'open-btn';
      openBtn.type = 'button';
      openBtn.textContent = '\u203A';
      openBtn.style.display = 'none';
      wrap.appendChild(ripple);
      wrap.appendChild(solid);
      wrap.appendChild(openBtn);

      nodeEl.appendChild(input);
      nodeEl.appendChild(wrap);

      input.addEventListener('input', () => {
        let start = 0, end = 0;
        try { start = input.selectionStart; end = input.selectionEnd; } catch (_) {}
        input.value = toTitleCase(input.value);
        try { input.setSelectionRange(start, end); } catch (_) {}
        requestAnimationFrame(updateCaret);
      });
      input.addEventListener('keyup', () => requestAnimationFrame(updateCaret));
      input.addEventListener('click', () => requestAnimationFrame(updateCaret));
      input.addEventListener('focus', () => { requestAnimationFrame(updateCaret); updateStatus(); });
      input.addEventListener('scroll', () => requestAnimationFrame(updateCaret));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (nodeEl._solidifying) return;
          const raw = input.value;
          if (!isValidWord(raw)) {
            if (!String(raw || '').trim()) {
              const nid = (nodeEl.dataset && nodeEl.dataset.nodeId) || nodeIdAt(idx);
              if (nid && autoRemoveEmptyLeaf(nid)) return;
              rejectEmpty(input);
            }
            else rejectTooLong(input);
            return;
          }
          showSolid(nodeEl, idx, toTitleCase(raw.trim()));
        }
      });
      input.addEventListener('blur', () => {
        fakeCaret.classList.remove('on');
        if (nodeEl._solidifying) return;
        if (wrap.classList.contains('show')) return;
        if (!input.classList.contains('show') && !input.classList.contains('edit-pop')) return;
        const raw = input.value;
        if (!isValidWord(raw)) {
          // v0.0.26: empty childless leaf with siblings auto-removes (no shake,
          // no refocus). Sole waiting input or structural parent keeps the
          // validation shake + hint. Over-long always shakes.
          // Defer focus: blur must finish first or refocus is ignored.
          const pw = parentWord();
          const suffix = pw ? ' in ' + pw : '';
          if (!String(raw || '').trim()) {
            const nid = (nodeEl.dataset && nodeEl.dataset.nodeId) || nodeIdAt(idx);
            if (nid && autoRemoveEmptyLeaf(nid)) return;
            shakeInput(input);
            status.textContent = 'Type a word first' + suffix;
            setTimeout(() => {
              try { input.focus(); } catch (_) {}
              if (document.activeElement === input) status.textContent = 'Type a word first' + suffix;
            }, 0);
          } else {
            shakeInput(input);
            status.textContent = 'Keep it under 60 chars';
            setTimeout(() => {
              try { input.focus(); } catch (_) {}
              if (document.activeElement === input) status.textContent = 'Keep it under 60 chars';
            }, 0);
          }
          return;
        }
        showSolid(nodeEl, idx, toTitleCase(raw.trim()));
      });
      solid.addEventListener('click', () => {
        solid.classList.remove('solid-unblur');
        solid.classList.add('blur-out');
        setTimeout(() => {
          solid.classList.remove('blur-out');
          input.value = getWordAt(idx) || '';
          showInput(nodeEl, true);
        }, 250);
      });
      openBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const target = nodeIdAt(idx);
        if (target) navigateTo(target);
      });

      // Initial per-node state: empty waits with input, word shows engraved solid.
      const saved = (getWordAt(idx) || '').trim();
      if (saved) {
        const w = toTitleCase(saved);
        setWordAt(idx, w);
        input.value = w;
        openBtn.setAttribute('aria-label', 'Open ' + w);
        openBtn.title = 'Open ' + w;
        showSolidNow(nodeEl, idx, w, { animate: false });
      } else {
        setWordAt(idx, '');
        input.value = '';
        wrap.classList.remove('show');
        openBtn.style.display = 'none';
        input.classList.remove('edit-pop');
        input.classList.remove('fade-blur-out');
        input.classList.add('show');
      }
      return nodeEl;
    }

    function render(focusIdx) {
      if (currentParentId && !graph.getNode(currentParentId)) currentParentId = null;
      pruneEmptiesToOne({ preserveCurrent: true });
      ensureLevelHasNode(currentParentId);
      const pages = clampPage();
      const vis = pages[page] || [];
      nodesEl.innerHTML = '';
      nodesEl.classList.toggle('show-4', vis.length === 4);
      vis.forEach((idx) => {
        nodesEl.appendChild(createNodeEl(idx));
      });
      pageUp.style.display = page > 0 ? '' : 'none';
      pageDown.style.display = page < pages.length - 1 ? '' : 'none';
      updateNav();
      updateStatus();
      if (focusIdx !== undefined && vis.includes(focusIdx)) {
        const el = nodesEl.querySelector('.root-node[data-idx="' + focusIdx + '"]');
        if (el) {
          const input = el.querySelector('.root-input');
          if (input && input.classList.contains('show')) {
            input.focus();
            hideCaretDelayed();
          }
        }
      } else if (focusIdx === 'first-empty-visible') {
        const emptyEl = [...nodesEl.querySelectorAll('.root-node')].find((el) => {
          const i = Number(el.dataset.idx);
          return !(getWordAt(i) || '').trim();
        });
        if (emptyEl) {
          const input = emptyEl.querySelector('.root-input');
          if (input) { input.focus(); hideCaretDelayed(); }
        }
      }
    }

    addBtn.addEventListener('click', () => {
      // Validation per level: only 1 empty waiting input at a time.
      const ordered = currentList();
      let emptyPos = -1;
      for (let i = 0; i < ordered.length; i++) {
        if (!isValidWord(ordered[i].word)) { emptyPos = i; break; }
      }
      if (emptyPos !== -1) {
        const pages = computePages(currentSize());
        for (let p = 0; p < pages.length; p++) {
          if (pages[p].includes(emptyPos)) { page = p; break; }
        }
        render(emptyPos);
        const el = nodesEl.querySelector('.root-node[data-idx="' + emptyPos + '"]');
        const inp = el && el.querySelector('.root-input');
        if (inp) rejectEmpty(inp);
        return;
      }
      graph.addNode('', currentParentId);
      saveGraph();
      updateNav();
      const pages = computePages(currentSize());
      page = pages.length - 1;
      render(currentSize() - 1);
    });
    backBtn.addEventListener('click', goBack);
    if (homeBtn) homeBtn.addEventListener('click', () => navigateTo(null));
    if (levelBackBtn) levelBackBtn.addEventListener('click', goBack);
    pageUp.addEventListener('click', () => {
      if (page > 0) { page--; render(); }
    });
    pageDown.addEventListener('click', () => {
      const pages = computePages(currentSize());
      if (page < pages.length - 1) { page++; render(); }
    });

    window.addEventListener('resize', updateCaret);

    // Add-node button bounce: newborn exploring within 3px radius every ~800ms.
    setInterval(() => {
      const x = (Math.random() * 6 - 3).toFixed(2);
      const y = (Math.random() * 6 - 3).toFixed(2);
      addBtn.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    }, 800);

    // Init: graph drives center. Migrate legacy keys if present.
    loadNodes();
    currentParentId = null;
    page = 0;
    render('first-empty-visible');
    // Autofocus first empty visible input on load (waiting state).
    requestAnimationFrame(() => {
      const emptyEl = [...nodesEl.querySelectorAll('.root-node')].find((el) => {
        const i = Number(el.dataset.idx);
        return !(getWordAt(i) || '').trim();
      });
      if (emptyEl) {
        const input = emptyEl.querySelector('.root-input');
        if (input) { input.focus(); hideCaretDelayed(); }
      }
      updateStatus();
    });
  </script>
  <script>
    // Alt-key element ID peek: hold Alt to show mono badges with friendly IDs.
    // Click a badge to copy its ID; release Alt or press Esc to hide.
    (() => {
      let badges = [];
      let visible = false;
      function isVisibleEl(el) {
        if (!el) return false;
        const cs = getComputedStyle(el);
        if (cs.display === 'none' || cs.visibility === 'hidden') return false;
        const r = el.getBoundingClientRect();
        return r.width > 0 && r.height > 0;
      }
      function collectTargets() {
        const out = [];
        const push = (el, id) => { if (el && isVisibleEl(el)) out.push({ el, id }); };
        push(document.getElementById('round-btn'), 'write-btn');
        push(document.getElementById('stage'), 'stage');
        push(document.getElementById('back-btn'), 'back-btn');
        push(document.getElementById('level-title'), 'level-title');
        push(document.getElementById('page-up'), 'page-up');
        push(document.getElementById('page-down'), 'page-down');
        push(document.getElementById('add-node-btn'), 'add-btn');
        push(document.getElementById('home-btn'), 'home-btn');
        push(document.getElementById('level-back-btn'), 'back-btn');
        push(document.getElementById('status'), 'status');
        push(document.getElementById('version'), 'version');
        document.querySelectorAll('#crumbs .crumb-btn').forEach((b) => {
          push(b, 'crumb-' + (b.dataset.crumb || '0'));
        });
        document.querySelectorAll('.root-node').forEach((nodeEl) => {
          const idx = nodeEl.dataset.idx || '0';
          push(nodeEl.querySelector('.root-input'), 'node-' + idx + '-box');
          push(nodeEl.querySelector('.solid-text'), 'node-' + idx + '-text');
          push(nodeEl.querySelector('.open-btn'), 'open-node-' + idx);
        });
        return out;
      }
      function showPeek() {
        if (visible) return;
        visible = true;
        hidePeek(true);
        visible = true;
        for (const { el, id } of collectTargets()) {
          const r = el.getBoundingClientRect();
          const b = document.createElement('div');
          b.className = 'id-badge';
          b.textContent = id;
          b.dataset.peekId = id;
          let top = r.top - 22;
          if (top < 4) top = r.bottom + 4;
          b.style.top = Math.round(top) + 'px';
          b.style.left = Math.round(Math.max(4, r.left)) + 'px';
          b.addEventListener('mousedown', (e) => e.preventDefault());
          b.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            try { navigator.clipboard.writeText(id); } catch (_) {}
            b.textContent = 'copied';
            b.classList.add('copied');
            setTimeout(() => {
              if (b.isConnected) {
                b.textContent = id;
                b.classList.remove('copied');
              }
            }, 800);
          });
          document.body.appendChild(b);
          badges.push(b);
        }
      }
      function hidePeek(keepFlag) {
        for (const b of badges) b.remove();
        badges = [];
        if (!keepFlag) visible = false;
      }
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Alt' && !e.repeat) {
          e.preventDefault();
          showPeek();
        } else if (e.key === 'Escape' && visible) {
          hidePeek();
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'Alt') { e.preventDefault(); hidePeek(); }
      });
      window.addEventListener('blur', () => hidePeek());
      window.addEventListener('resize', () => { if (visible) showPeekRefresh(); });
      function showPeekRefresh() {
        const was = visible;
        hidePeek(true);
        visible = false;
        if (was) showPeek();
      }
    })();
  </script>
  <script>
    // Dev hot reload: poll HEAD every 1s, reload if Last-Modified/ETag/length changed.
    (() => {
      const url = location.pathname;
      const keyOf = (h) =>
        (h.get('last-modified') || '') + '|' +
        (h.get('content-length') || '') + '|' +
        (h.get('etag') || '');
      let last = null;
      async function poll() {
        try {
          const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
          const k = keyOf(r.headers);
          if (last === null) { last = k; return; }
          if (k !== last) location.reload();
        } catch (_) {}
      }
      poll().then(() => setInterval(poll, 1000));
    })();
  </script>
