  body.focus-underline .root-node:focus-within::after {
    content: '';
    display: block;
    width: 60%;
    height: 4px;

    border-radius: 2px;

  /* EXPERIMENTAL v0.0.66 (corners only, bottom off): camera-shutter focus UI.

     No container box-shadow (keeps per-letter glow); shrink 0.98 + lift untouched.
     v0.0.67: animate in only (no loop) — fade + grow 10px->14px + slight
     outward move, 0.2s ease via opacity/size/offset transition; base stays
     rendered at opacity:0 so the transition can run (no display toggle).
     v0.0.69: translate glide — unfocused corners sit 4px inward, glide to 0

     Rollback: set flag false (or re-enable focusUnderline) + delete this block + dark block below. */
  body.focus-corners .root-node .corner {
    display: block;
    position: absolute;
    width: 10px;
    height: 10px;
    border: 0 solid rgba(0,0,0,0.35);
    pointer-events: none;
    opacity: 0;

  body.focus-corners .root-node .corner.tr { top: -4px; right: -8px; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 2px; transform: translate(-4px, 4px); }
  body.focus-corners .root-node .corner.bl { bottom: -4px; left: -8px; border-bottom-width: 2px; border-left-width: 2px; border-bottom-left-radius: 2px; transform: translate(4px, -4px); }
  body.focus-corners .root-node .corner.br { bottom: -4px; right: -8px; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 2px; transform: translate(-4px, -4px); }

  <script>
    const nodesEl = document.getElementById('nodes');
    const addBtn = document.getElementById('add-node-btn');
    const pageUp = document.getElementById('page-up');
    const pageDown = document.getElementById('page-down');
    const status = document.getElementById('status');
    const LS_GRAPH = 'root-graph-json';
    const LS_NEW = 'root-nodes-json';
    const LS_OLD = 'root-node-word';
    const LS_PARENT = 'root-current-parent';
    const LS_PAGE = 'root-current-page';

    // Feature flags (v0.0.22): toggle experiments here. Ripple is OFF by default.
    // Override via localStorage: localStorage.setItem('feat-ripple', '1') to force on, '0' to force off.
    // EXPERIMENTAL v0.0.64, v0.0.65 gap fix rollback ready (single commit): focusUnderline adds a
    // dim thick bottom outline under the focused node. Set false to disable
    // (easy off, no other changes needed). Awaiting feedback before keeping.
    // EXPERIMENTAL v0.0.66, v0.0.67 animate, v0.0.69 translate glide: focusCorners adds camera-shutter corner L shapes
    // (tl/tr/bl/br) on the focused node; bottom underline OFF (code kept for
    // rollback). v0.0.67: corners fade + grow 10px->14px + outward move, 0.2s
    // ease, animate-in only (no loop). v0.0.69: unfocused corners sit 4px inward,
    // glide to translate(0,0) on focus (transform 0.2s). Set focusCorners false to disable.
    const FEATURES = { ripple: false, focusUnderline: false, focusCorners: true };
    function shouldRipple() {
      try {
        const v = localStorage.getItem('feat-ripple');
        if (v !== null) return v === '1' || v === 'true';
      } catch (_) {}
      return !!FEATURES.ripple;
    }
    if (!shouldRipple()) console.log('[features] ripple off');
    // EXPERIMENTAL v0.0.64, v0.0.65 gap fix rollback ready: gate bottom-outline CSS behind
    // body.focus-underline so FEATURES.focusUnderline=false removes it.
    // v0.0.66: code kept for rollback (flag false by default).
    try {
      let fu = !!FEATURES.focusUnderline;
      try {
        const ov = localStorage.getItem('feat-focus-underline');
        if (ov !== null) fu = (ov === '1' || ov === 'true');
      } catch (_) {}
      if (fu) document.body.classList.add('focus-underline');
      else console.log('[features] focus-underline off');
    } catch (_) {}
    // EXPERIMENTAL v0.0.66, v0.0.67 animate: gate corner L-shape CSS behind
    // body.focus-corners so FEATURES.focusCorners=false removes it.
    try {
      let fc = !!FEATURES.focusCorners;
      try {
        const ov = localStorage.getItem('feat-focus-corners');
        if (ov !== null) fc = (ov === '1' || ov === 'true');
      } catch (_) {}
      if (fc) document.body.classList.add('focus-corners');
      else console.log('[features] focus-corners off');
    } catch (_) {}

    // Font-weight state (v0.0.55: defined before fonts so weight-lazy
    // ensureWebfont can load only the active weight). 4 steps, persists in
    // 'node-weight-idx', default 400 (idx 1).
    const LS_WEIGHT = 'node-weight-idx';
    const NODE_WEIGHTS = ['300', '400', '600', '800'];
    let weightIdx = 1;
    try {
      const rw0 = localStorage.getItem(LS_WEIGHT);
      if (rw0 !== null) {
        const nw0 = parseInt(rw0, 10);
        if (Number.isFinite(nw0) && nw0 >= 0 && nw0 < NODE_WEIGHTS.length) weightIdx = nw0;
      }
    } catch (_) {}

    // Font trial switcher (v0.0.55 page-wide, weight-lazy): cycles page font
    // stack for body + .root-input + .solid-text + buttons/status/crumbs
    // (shared var(--page-font) page-wide + var(--node-font) kept in sync). No font
    // CSS in <head>: initial paint is System UI, zero webfonts fetched
    // upfront. First cycle to a webfont injects only the active weight's
    // sheet (css2 single wght, display=swap) + on-demand preconnect; cycling
    // weight (300/400/600/800) loads that weight on demand per family
    // (cache per family+weight); stack fallback covers offline/missing.
    // Persists in 'node-font-idx'. Order: System UI default first.
    const LS_FONT = 'node-font-idx';
    const NODE_FONTS = [
      { name: 'System UI', stack: 'system-ui, -apple-system, sans-serif', fam: null },
      { name: 'System Mono', stack: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace', fam: null },
      { name: 'JetBrains Mono', stack: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace', fam: 'JetBrains+Mono', weights: [300, 400, 600, 800] },
      { name: 'IBM Plex Mono', stack: '"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace', fam: 'IBM+Plex+Mono', weights: [300, 400, 600, 700] },
      { name: 'Space Mono', stack: '"Space Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace', fam: 'Space+Mono', weights: [400, 700] },
      { name: 'Lexend', stack: '"Lexend", system-ui, sans-serif', fam: 'Lexend', weights: [300, 400, 600, 800] },
      { name: 'Inter Tight', stack: '"Inter Tight", system-ui, sans-serif', fam: 'Inter+Tight', weights: [300, 400, 600, 800] },
      { name: 'Georgia', stack: 'Georgia, "Times New Roman", serif', fam: null },
    ];
    // Map a wanted weight (e.g. '600') to the nearest weight the family
    // actually ships, so single-weight css2 requests never 400 (Space Mono
    // has only 400/700; Plex 800 -> 700). Exact match wins, else nearest.
    function fontWeightFor(font, want) {
      if (!font || !font.fam || !Array.isArray(font.weights) || !font.weights.length) return null;
      const w = parseInt(want, 10);
      if (!Number.isFinite(w)) return font.weights.indexOf(400) !== -1 ? 400 : font.weights[0];
      if (font.weights.indexOf(w) !== -1) return w;
      let best = font.weights[0];
      let bestD = Math.abs(font.weights[0] - w);
      for (let k = 1; k < font.weights.length; k++) {
        const d = Math.abs(font.weights[k] - w);
        if (d < bestD) { bestD = d; best = font.weights[k]; }
      }
      return best;
    }
    function fontCssFor(font, want) {
      const m = fontWeightFor(font, want);
      if (!font || !font.fam || m === null) return null;
      return font.fam + ':wght@' + m;
    }
    const loadedFontCss = {};
    function ensurePreconnect() {
      try {
        if (!document.querySelector('link[data-lazy-preconnect]')) {
          const p1 = document.createElement('link');
          p1.rel = 'preconnect';
          p1.href = 'https://fonts.googleapis.com';
          p1.setAttribute('data-lazy-preconnect', '1');
          document.head.appendChild(p1);
          const p2 = document.createElement('link');
          p2.rel = 'preconnect';
          p2.href = 'https://fonts.gstatic.com';
          p2.crossOrigin = '';
          p2.setAttribute('data-lazy-preconnect', '1');
          document.head.appendChild(p2);
        }
      } catch (_) {}
    }
    function ensureWebfont(i, wantWeight) {
      const f = NODE_FONTS[i];
      if (!f || !f.fam) return;
      const want = (wantWeight !== undefined && wantWeight !== null)
        ? wantWeight
        : (typeof NODE_WEIGHTS !== 'undefined' && typeof weightIdx !== 'undefined' ? NODE_WEIGHTS[weightIdx] : '400');
      const css = fontCssFor(f, want);
      if (!css || loadedFontCss[css]) return;
      try {
        ensurePreconnect();
        const l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=' + css + '&display=swap';
        l.setAttribute('data-lazy-font', f.name + ':' + fontWeightFor(f, want));
        // Offline: stack already falls back to system; allow retry.
        l.onerror = () => { try { delete loadedFontCss[css]; } catch (_) {} };
        document.head.appendChild(l);
        loadedFontCss[css] = l;
      } catch (_) {}
    }
    let fontIdx = 0;
    try {
      const rf = localStorage.getItem(LS_FONT);
      if (rf !== null) {
        const nf = parseInt(rf, 10);
        if (Number.isFinite(nf) && nf >= 0 && nf < NODE_FONTS.length) fontIdx = nf;
      }
    } catch (_) {}
    let fontStatusTimer = null;
    function applyFont(i, silent) {
      fontIdx = ((i % NODE_FONTS.length) + NODE_FONTS.length) % NODE_FONTS.length;
      ensureWebfont(fontIdx, NODE_WEIGHTS[weightIdx]);
      try { document.documentElement.style.setProperty('--page-font', NODE_FONTS[fontIdx].stack); } catch (_) {}
      try { document.documentElement.style.setProperty('--node-font', NODE_FONTS[fontIdx].stack); } catch (_) {}
      try { localStorage.setItem(LS_FONT, String(fontIdx)); } catch (_) {}
      if (!silent) {
        try { status.textContent = 'Font: ' + NODE_FONTS[fontIdx].name; } catch (_) {}
        if (fontStatusTimer) clearTimeout(fontStatusTimer);
        fontStatusTimer = setTimeout(() => { try { updateStatus(); } catch (_) {} }, 1200);
      }
      try {
        if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
          document.fonts.ready.then(() => requestAnimationFrame(() => {
            try {
              document.querySelectorAll('.root-input.show, .root-input.edit-pop').forEach(autoGrow);
            try { const _nb = document.getElementById('node-body'); if (_nb && _nb.style.display !== 'none') autoGrow(_nb); } catch (_) {}
            } catch (_) {}
          })).catch(() => {});
        }
      } catch (_) {}
      requestAnimationFrame(() => {
        try {
          document.querySelectorAll('.root-input.show, .root-input.edit-pop').forEach(autoGrow);
            try { const _nb = document.getElementById('node-body'); if (_nb && _nb.style.display !== 'none') autoGrow(_nb); } catch (_) {}
        } catch (_) {}
      });
    }
    ensureWebfont(fontIdx);
    try { document.documentElement.style.setProperty('--page-font', NODE_FONTS[fontIdx].stack); } catch (_) {}
    try { document.documentElement.style.setProperty('--node-font', NODE_FONTS[fontIdx].stack); } catch (_) {}

    // Letter-spacing cycler (v0.0.45): cycles node spacing for .root-input +
    // .solid-text via shared var(--node-spacing). 4 steps, persists in
    // 'node-spacing-idx', status flashes "Spacing <val>".
    const LS_SPACING = 'node-spacing-idx';
    const NODE_SPACINGS = ['-0.02em', '0em', '0.04em', '0.08em', '0.12em'];
    let spacingIdx = 2;
    try {
      const rs = localStorage.getItem(LS_SPACING);
      if (rs !== null) {
        const ns = parseInt(rs, 10);
        if (Number.isFinite(ns) && ns >= 0 && ns < NODE_SPACINGS.length) spacingIdx = ns;
      }
    } catch (_) {}
    let spacingStatusTimer = null;
    function applySpacing(i, silent) {
      spacingIdx = ((i % NODE_SPACINGS.length) + NODE_SPACINGS.length) % NODE_SPACINGS.length;
      try { document.documentElement.style.setProperty('--node-spacing', NODE_SPACINGS[spacingIdx]); } catch (_) {}
      try { localStorage.setItem(LS_SPACING, String(spacingIdx)); } catch (_) {}
      if (!silent) {
        try { status.textContent = 'Spacing ' + NODE_SPACINGS[spacingIdx]; } catch (_) {}
        if (spacingStatusTimer) clearTimeout(spacingStatusTimer);
        spacingStatusTimer = setTimeout(() => { try { updateStatus(); } catch (_) {} }, 1200);
      }
      requestAnimationFrame(() => {
        try {
          document.querySelectorAll('.root-input.show, .root-input.edit-pop').forEach(autoGrow);
            try { const _nb = document.getElementById('node-body'); if (_nb && _nb.style.display !== 'none') autoGrow(_nb); } catch (_) {}
        } catch (_) {}
      });
    }
    try { document.documentElement.style.setProperty('--node-spacing', NODE_SPACINGS[spacingIdx]); } catch (_) {}

    // Line-height cycler (v0.0.47, v0.0.50 tight): cycles node leading for .root-input +
    // .solid-text via shared var(--node-leading). 5 steps, persists in
    // 'node-leading-idx', status flashes "Leading <val>".
    const LS_LEADING = 'node-leading-idx';
    const NODE_LEADINGS = ['0.85', '1.0', '1.3', '1.6', '2.0'];
    let leadingIdx = 2;
    try {
      const rl = localStorage.getItem(LS_LEADING);
      if (rl !== null) {
        const nl = parseInt(rl, 10);
        if (Number.isFinite(nl) && nl >= 0 && nl < NODE_LEADINGS.length) leadingIdx = nl;
      }
    } catch (_) {}
    let leadingStatusTimer = null;
    function applyLeading(i, silent) {
      leadingIdx = ((i % NODE_LEADINGS.length) + NODE_LEADINGS.length) % NODE_LEADINGS.length;
      try { document.documentElement.style.setProperty('--node-leading', NODE_LEADINGS[leadingIdx]); } catch (_) {}
      try { localStorage.setItem(LS_LEADING, String(leadingIdx)); } catch (_) {}
      if (!silent) {
        try { status.textContent = 'Leading ' + NODE_LEADINGS[leadingIdx]; } catch (_) {}
        if (leadingStatusTimer) clearTimeout(leadingStatusTimer);
        leadingStatusTimer = setTimeout(() => { try { updateStatus(); } catch (_) {} }, 1200);
      }
      requestAnimationFrame(() => {
        try {
          document.querySelectorAll('.root-input.show, .root-input.edit-pop').forEach(autoGrow);
            try { const _nb = document.getElementById('node-body'); if (_nb && _nb.style.display !== 'none') autoGrow(_nb); } catch (_) {}
        } catch (_) {}
      });
    }
    try { document.documentElement.style.setProperty('--node-leading', NODE_LEADINGS[leadingIdx]); } catch (_) {}

    // Font-weight cycler (v0.0.53, v0.0.55 weight-lazy): cycles base node
    // weight thin->bold for .root-input + .solid-text via shared
    // var(--node-weight). 4 steps, persists in 'node-weight-idx' (state
    // defined above fonts), status flashes "Weight <val>". Each step loads
    // only that weight's sheet for the active family on demand
    // (ensureWebfont family+weight cache, nearest-match map); system stacks
    // skip load. Press animation still thickens to 800 max (keyframes from
    // var -> 800); steady-state reload solids keep 800 like the animated end.
    let weightStatusTimer = null;
    function applyWeight(i, silent) {
      weightIdx = ((i % NODE_WEIGHTS.length) + NODE_WEIGHTS.length) % NODE_WEIGHTS.length;
      ensureWebfont(fontIdx, NODE_WEIGHTS[weightIdx]);
      try { document.documentElement.style.setProperty('--node-weight', NODE_WEIGHTS[weightIdx]); } catch (_) {}
      try { localStorage.setItem(LS_WEIGHT, String(weightIdx)); } catch (_) {}
      if (!silent) {
        try { status.textContent = 'Weight ' + NODE_WEIGHTS[weightIdx]; } catch (_) {}
        if (weightStatusTimer) clearTimeout(weightStatusTimer);
        weightStatusTimer = setTimeout(() => { try { updateStatus(); } catch (_) {} }, 1200);
      }
      try {
        if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
          document.fonts.ready.then(() => requestAnimationFrame(() => {
            try {
              document.querySelectorAll('.root-input.show, .root-input.edit-pop').forEach(autoGrow);
            try { const _nb = document.getElementById('node-body'); if (_nb && _nb.style.display !== 'none') autoGrow(_nb); } catch (_) {}
            } catch (_) {}
          })).catch(() => {});
        }
      } catch (_) {}
      requestAnimationFrame(() => {
        try {
          document.querySelectorAll('.root-input.show, .root-input.edit-pop').forEach(autoGrow);
            try { const _nb = document.getElementById('node-body'); if (_nb && _nb.style.display !== 'none') autoGrow(_nb); } catch (_) {}
        } catch (_) {}
      });
    }
    try { document.documentElement.style.setProperty('--node-weight', NODE_WEIGHTS[weightIdx]); } catch (_) {}

    // Font-size cycler (v0.0.58): cycles node size for .root-input +
    // .solid-text via shared var(--node-size). 4 steps, persists in
    // 'node-size-idx', status flashes "Size <val>". show-4 compact scales
    // proportionally via calc(var(--node-size)*0.8).
    const LS_SIZE = 'node-size-idx';
    const NODE_SIZES = ['1.4rem', '1.6rem', '2rem', '2.6rem'];
    let sizeIdx = 2;
    try {
      const rs2 = localStorage.getItem(LS_SIZE);
      if (rs2 !== null) {
        const ns2 = parseInt(rs2, 10);
        if (Number.isFinite(ns2) && ns2 >= 0 && ns2 < NODE_SIZES.length) sizeIdx = ns2;
      }
    } catch (_) {}
    let sizeStatusTimer = null;
    function applySize(i, silent) {
      sizeIdx = ((i % NODE_SIZES.length) + NODE_SIZES.length) % NODE_SIZES.length;
      try { document.documentElement.style.setProperty('--node-size', NODE_SIZES[sizeIdx]); } catch (_) {}
      try { localStorage.setItem(LS_SIZE, String(sizeIdx)); } catch (_) {}
      if (!silent) {
        try { status.textContent = 'Size ' + NODE_SIZES[sizeIdx]; } catch (_) {}
        if (sizeStatusTimer) clearTimeout(sizeStatusTimer);
        sizeStatusTimer = setTimeout(() => { try { updateStatus(); } catch (_) {} }, 1200);
      }
      requestAnimationFrame(() => {
        try {
          document.querySelectorAll('.root-input.show, .root-input.edit-pop').forEach(autoGrow);
            try { const _nb = document.getElementById('node-body'); if (_nb && _nb.style.display !== 'none') autoGrow(_nb); } catch (_) {}
        } catch (_) {}
      });
    }
    try { document.documentElement.style.setProperty('--node-size', NODE_SIZES[sizeIdx]); } catch (_) {}

    function toTitleCase(s) {
      return s.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
    }
    // Empty-node validation (v0.0.19): a word needs >=1 visible char,
    // capped at MAX_WORD_LEN. Used by Enter/blur solidify + add button.
    const MAX_WORD_LEN = 60;
    function isValidWord(word) {
      const t = String(word || '').trim();
      return t.length >= 1 && t.length <= MAX_WORD_LEN;
    }
    function shakeInput(input) {
      if (!input) return;
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('shake');
      setTimeout(() => { input.classList.remove('shake'); }, 350);
    }
    function rejectEmpty(input) {
      shakeInput(input);
      try { input.focus(); } catch (_) {}
      const pw = parentWord();
      status.textContent = 'Type a word first' + (pw ? ' in ' + pw : '');
    }
    function rejectTooLong(input) {
      shakeInput(input);
      try { input.focus(); } catch (_) {}
      status.textContent = 'Keep it under 60 chars';
    }
    function newNodeId() {
      try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (_) {}
      return 'n-' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e9).toString(36);
    }

    // Tree Graph store (v0.0.20, v2 JSON; v0.0.59 body; v0.0.79 trash): each node
    // {id, word, body, parentId (null = root), createdAt, order,
    //  trashed (false = active), trashedAt (ms, 0 = never)}.
    // Trash design: clearing a childless leaf moves it to trash
    // (trashed=true, keeps id/word(parentId+last word+body) for restore)
    // instead of destroy; trashed nodes are excluded from
    // currentList/count/paging/render, persisted in root-graph-json,
    // old saves without trash fields migrate to trashed=false.
    // Structural empty parents (have children) are never trashed.
    const GRAPH_VERSION = 2;
    class Graph {
      constructor() {
        this.nodes = new Map();
        this.adj = new Map();
        this.order = [];
      }
      get size() {
        let n = 0;
        for (const node of this.nodes.values()) if (!node.trashed) n++;
        return n;
      }
      get trashSize() {
        let n = 0;
        for (const node of this.nodes.values()) if (node.trashed) n++;
        return n;
      }
      addNode(word, parentId) {
        const w = word || '';
        const pid = (parentId !== undefined && parentId !== null && this.nodes.has(parentId))
          ? parentId : null;
        const id = newNodeId();
        const node = { id, word: w, body: '', parentId: pid, createdAt: Date.now(), order: this.order.length, trashed: false, trashedAt: 0 };
        this.nodes.set(id, node);
        this.adj.set(id, new Set());
        if (pid) this.addEdge(pid, id);
        this.order.push(id);
        return id;
      }
      updateNode(id, word) {
        const n = this.nodes.get(id);
        if (!n) return;
        n.word = word;
      }
      updateBody(id, body) {
        const n = this.nodes.get(id);
        if (!n) return;
        n.body = String(body !== undefined && body !== null ? body : '');
      }
      removeNode(id) {
        if (!this.nodes.has(id)) return false;
        // Cascade: collect id + all descendants via parentId links.
        const doomed = new Set([id]);
        let grew = true;
        while (grew) {
          grew = false;
          for (const [nid, n] of this.nodes) {
            if (!doomed.has(nid) && n.parentId && doomed.has(n.parentId)) {
              doomed.add(nid);
              grew = true;
            }
          }
        }
        for (const d of doomed) {
          this.nodes.delete(d);
          this.adj.delete(d);

      try { crumbToggleBtn.setAttribute('aria-expanded', crumbsVisible ? 'true' : 'false'); } catch (_) {}
      // Header (parent word only, no count, no Root).
      if (p) {
        const pw = (p.word || '').trim() || '(empty)';
        levelTitle.textContent = pw;
        levelTitle.style.display = '';
      } else {
        levelTitle.textContent = '';
        levelTitle.style.display = 'none';
      }
      try { syncNodeBody(); } catch (_) {}
      // Breadcrumb: hidden by default, toggle via #crumb-toggle-btn; trail only when inside.
      crumbsEl.innerHTML = '';
      const mkCrumb = (label, targetId, isCurrent, crumbIdx) => {
        const b = document.createElement('button');
        b.className = 'crumb-btn' + (isCurrent ? ' current' : '');
        b.type = 'button';
        b.textContent = label;
        b.dataset.crumb = String(crumbIdx);
        if (isCurrent) {
          b.disabled = true;
          b.setAttribute('aria-current', 'page');
        } else {
          b.title = targetId ? 'Open ' + label : 'Back to roots';
          b.setAttribute('aria-label', targetId ? 'Open ' + label : 'Back to roots');
          b.addEventListener('click', () => navigateTo(targetId));
        }
        return b;
      };
      const mkSep = () => {
        const s = document.createElement('span');
        s.className = 'crumb-sep';
        s.textContent = '/';
        return s;
      };
      if (!p) {
        crumbsEl.style.display = 'none';
        if (navBar) navBar.style.display = 'none';
        if (crumbCount) crumbCount.textContent = '';
      } else {
        crumbsEl.style.display = crumbsVisible ? '' : 'none';
        if (navBar) navBar.style.display = '';
        const chain = crumbPath(); // [...ancestors, current]
        if (crumbCount) crumbCount.textContent = String(chain.length);
        chain.forEach((node, k) => {
          const isCur = k === chain.length - 1;
          const label = (node.word || '').trim() || '(empty)';
          crumbsEl.appendChild(mkCrumb(label, node.id, isCur, k));
          if (!isCur) crumbsEl.appendChild(mkSep());
        });
      }
      // Contextual add button + placeholder hint.
      const pw2 = parentWord();
      // Level nav row (v0.0.56): pagers live in-row between back + crumb-toggle.
      // Row visible when inside OR paging (root pagers still reachable);
      // home/back/crumb-toggle only when inside, pagers only when paging.
      const navPages = computePages(currentSize());
      const needUp = page > 0;
      const needDown = page < navPages.length - 1;
      const needPaging = needUp || needDown;
      if (levelNav) levelNav.style.display = (p || needPaging) ? '' : 'none';
      if (homeBtn) homeBtn.style.display = p ? '' : 'none';
      if (levelBackBtn) levelBackBtn.style.display = p ? '' : 'none';
      if (crumbToggleBtn) crumbToggleBtn.style.display = p ? '' : 'none';
      if (pageUp) pageUp.style.display = needUp ? '' : 'none';
      if (pageDown) pageDown.style.display = needDown ? '' : 'none';
      if (p) {
        addBtn.setAttribute('aria-label', 'Add child to ' + (pw2 || 'parent'));
        addBtn.title = 'Add to ' + (pw2 || 'parent');
      } else {
        addBtn.setAttribute('aria-label', 'Add root node');
        addBtn.title = 'Add root node';
      }
      if (p && crumbsVisible && crumbsEl.style.display !== 'none') {
        requestAnimationFrame(positionCrumbMenu);
      }
    }

    function showInput(nodeEl, fromEdit) {
      const input = nodeEl.querySelector('.root-input');
      const wrap = nodeEl.querySelector('.solid-wrap');
      const openBtn = nodeEl.querySelector('.open-btn');
      if (openBtn) openBtn.style.display = 'none';
      wrap.classList.remove('show');
      if (fromEdit) {
        input.classList.remove('show');
        input.classList.remove('edit-pop');
        input.classList.remove('fade-blur-out');
        void input.offsetWidth;
        input.classList.add('edit-pop');
      } else {
        input.classList.remove('edit-pop');
        input.classList.remove('fade-blur-out');
        input.classList.add('show');
      }
      input.focus();
      try { input.setSelectionRange(input.value.length, input.value.length); } catch (_) {}
      autoGrow(input);
      updateStatus();
    }

    function showSolid(nodeEl, idx, word, opts) {
      if (nodeEl._solidifying) return;
      const focusSolid = !!(opts && opts.focusSolid);
      const input = nodeEl.querySelector('.root-input');
      const inputVisible = input.classList.contains('show') || input.classList.contains('edit-pop');
      if (inputVisible) {
        nodeEl._solidifying = true;
        input.classList.remove('show');
        input.classList.remove('edit-pop');
        void input.offsetWidth;
        input.classList.add('fade-blur-out');
        setTimeout(() => {
          input.classList.remove('fade-blur-out');
          nodeEl._solidifying = false;
          showSolidNow(nodeEl, idx, word, focusSolid ? { focusSolid: true } : undefined);
        }, 250);
      } else {
        showSolidNow(nodeEl, idx, word, focusSolid ? { focusSolid: true } : undefined);
      }
    }

    function showSolidNow(nodeEl, idx, word, opts) {
      const animate = !opts || opts.animate !== false;
      const focusSolid = !!(opts && opts.focusSolid);
      setWordAt(idx, word);
      saveGraph();
      const input = nodeEl.querySelector('.root-input');
      const wrap = nodeEl.querySelector('.solid-wrap');
      const solid = nodeEl.querySelector('.solid-text');
      const ripple = nodeEl.querySelector('.ripple');
      const openBtn = nodeEl.querySelector('.open-btn');
      input.classList.remove('show');
      input.classList.remove('edit-pop');
      input.classList.remove('fade-blur-out');
      solid.innerHTML = '';
      [...word].forEach((ch) => {
        // Spaces stay plain breaking text nodes so lines wrap between
        // words; letters stay inline-block (thicken transform needs it)
        // with break opportunities between them for long words.
        if (ch === ' ') { solid.appendChild(document.createTextNode(' ')); return; }
        const sp = document.createElement('span');
        sp.className = 'letter';
        sp.textContent = ch;
        if (!animate) {
          sp.style.animation = 'none';
          sp.style.fontWeight = '800';
        }
        solid.appendChild(sp);
      });
      solid.classList.remove('blur-out');
      solid.classList.remove('solid-unblur');
      wrap.classList.remove('show');
      solid.setAttribute('aria-label', 'Edit ' + word);
      if (openBtn) {
        openBtn.style.display = '';
        openBtn.setAttribute('aria-label', 'Open ' + word);
        openBtn.title = 'Open ' + word;
      }
      if (animate) {
        if (shouldRipple()) {
          ripple.style.display = '';
          ripple.style.animation = 'none';
          void ripple.offsetWidth;
          ripple.style.animation = '';
        } else {
          ripple.style.animation = 'none';
          ripple.style.display = 'none';
        }
        void wrap.offsetWidth;
        wrap.classList.add('show');
        void solid.offsetWidth;
        solid.classList.add('solid-unblur');
      } else {
        ripple.style.animation = 'none';
        ripple.style.display = shouldRipple() ? '' : 'none';
        wrap.classList.add('show');
      }
      updateNav();
      updateStatus();
      // v0.0.83: Enter-save focuses the new solid (tabindex, no edit reopen)
      // so keyboard nav continues + corners show. Only when focusSolid flag
      // is set (Enter path); initial load (animate:false) never steals.
      if (focusSolid) {
        try { solid.focus({ preventScroll: true }); } catch (_) { try { solid.focus(); } catch (_) {} }
        try { updateStatus(); } catch (_) {}
      }
    }

    function createNodeEl(idx) {
      const nodeEl = document.createElement('div');
      nodeEl.className = 'root-node';
      nodeEl.dataset.idx = String(idx);
      const nid = nodeIdAt(idx);
      if (nid) nodeEl.dataset.nodeId = nid;
    // EXPERIMENTAL v0.0.66 focus corners, v0.0.67 animate: 4 shutter L shapes, visibility
      // gated by body.focus-corners + :focus-within opacity (always rendered,
      // base opacity:0 so the 0.2s fade/grow transition can run).
      for (const pos of ['tl', 'tr', 'bl', 'br']) {
        const c = document.createElement('div');

        c.setAttribute('aria-hidden', 'true');

      const pw0 = parentWord();
      // v0.0.43 wrap: textarea rows=1 soft-wrap auto-grow (single-line

      const input = document.createElement('textarea');
      input.className = 'root-input';
      input.rows = 1;
      input.wrap = 'soft';

      input.value = getWordAt(idx) || '';

      const wrap = document.createElement('div');
      wrap.className = 'solid-wrap';
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      const solid = document.createElement('div');
      solid.className = 'solid-text';
      solid.title = 'Click to edit';
      solid.tabIndex = 0;
      solid.setAttribute('role', 'button');
      solid.setAttribute('aria-label', 'Edit node');
      const openBtn = document.createElement('button');
      openBtn.className = 'open-btn';
      openBtn.type = 'button';
      openBtn.textContent = '\u203A';
      openBtn.style.display = 'none';
      wrap.appendChild(ripple);
      wrap.appendChild(solid);
      wrap.appendChild(openBtn);

      nodeEl.appendChild(input);
      nodeEl.appendChild(wrap);

      input.addEventListener('input', () => {
        let start = 0, end = 0;
        try { start = input.selectionStart; end = input.selectionEnd; } catch (_) {}
        input.value = toTitleCase(String(input.value).replace(/[\r\n]+/g, ' '));
        try { input.setSelectionRange(start, end); } catch (_) {}
        autoGrow(input);
      });
      input.addEventListener('focus', () => { autoGrow(input); updateStatus(); });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (nodeEl._solidifying) return;
          const raw = input.value;
          if (!isValidWord(raw)) {
            if (!String(raw || '').trim()) {
              const nid = (nodeEl.dataset && nodeEl.dataset.nodeId) || nodeIdAt(idx);
              if (nid && autoRemoveEmptyLeaf(nid)) return;
              rejectEmpty(input);
            }
            else rejectTooLong(input);
            return;
          }
          showSolid(nodeEl, idx, toTitleCase(raw.trim()), { focusSolid: true });
        }
      });
      input.addEventListener('blur', () => {
        if (nodeEl._solidifying) return;
        if (wrap.classList.contains('show')) return;
        if (!input.classList.contains('show') && !input.classList.contains('edit-pop')) return;
        const raw = input.value;
        if (!isValidWord(raw)) {
          // v0.0.26: empty childless leaf with siblings auto-removes (no shake,
          // no refocus). Sole waiting input or structural parent keeps the
          // validation shake + hint. Over-long always shakes.
          // Defer focus: blur must finish first or refocus is ignored.
          const pw = parentWord();
          const suffix = pw ? ' in ' + pw : '';
          if (!String(raw || '').trim()) {
            const nid = (nodeEl.dataset && nodeEl.dataset.nodeId) || nodeIdAt(idx);
            if (nid && autoRemoveEmptyLeaf(nid)) return;
            shakeInput(input);
            status.textContent = 'Type a word first' + suffix;
            setTimeout(() => {
              try { input.focus(); } catch (_) {}
              if (document.activeElement === input) status.textContent = 'Type a word first' + suffix;
            }, 0);
          } else {
            shakeInput(input);
            status.textContent = 'Keep it under 60 chars';
            setTimeout(() => {
              try { input.focus(); } catch (_) {}
              if (document.activeElement === input) status.textContent = 'Keep it under 60 chars';
            }, 0);
          }
          return;
        }
        showSolid(nodeEl, idx, toTitleCase(raw.trim()));
      });
      solid.addEventListener('click', () => {
        solid.classList.remove('solid-unblur');
        solid.classList.add('blur-out');
        setTimeout(() => {
          solid.classList.remove('blur-out');
          input.value = getWordAt(idx) || '';
          showInput(nodeEl, true);
        }, 250);
      });
      // Keyboard nav (v0.0.30): Enter on a focused solid opens edit, same as click.
      solid.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          solid.click();
        }
      });
      solid.addEventListener('focus', () => updateStatus());
      openBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const target = nodeIdAt(idx);
        if (target) navigateTo(target);
      });

      // Initial per-node state: empty waits with input, word shows engraved solid.
      const saved = (getWordAt(idx) || '').trim();
      if (saved) {
        const w = toTitleCase(saved);
        setWordAt(idx, w);
        input.value = w;
        openBtn.setAttribute('aria-label', 'Open ' + w);
        openBtn.title = 'Open ' + w;
        showSolidNow(nodeEl, idx, w, { animate: false });
      } else {
        setWordAt(idx, '');
        input.value = '';
        wrap.classList.remove('show');
        openBtn.style.display = 'none';
        input.classList.remove('edit-pop');
        input.classList.remove('fade-blur-out');
        input.classList.add('show');
        autoGrow(input);
      }
      return nodeEl;
    }

    // Auto-focus first node (v0.0.48): after load / level open, focus first
    // visible node — empty waiting input (caret) if present, else first
    // solid (tabindex, no edit). Skips when Alt peek badges visible.
    // Only called from the 'first-empty-visible' render path + navigate/load
    // rAF, never on paging/stepFocus renders.
    function focusFirstVisible() {
      try {
        if (document.querySelector('.id-badge')) return false;
      } catch (_) {}
      const nodes = [...nodesEl.querySelectorAll('.root-node')];
      if (nodes.length === 0) return false;
      const emptyEl = nodes.find((el) => {
        const i = Number(el.dataset.idx);
        return !(getWordAt(i) || '').trim();
      });
      if (emptyEl) {
        const input = emptyEl.querySelector('.root-input');
        if (input) {
          try { autoGrow(input); } catch (_) {}
          try { input.focus(); } catch (_) {}
          return true;
        }
      }
      const firstEl = nodes[0];
      const t = (typeof focusableForNodeEl === 'function')
        ? focusableForNodeEl(firstEl)
        : firstEl.querySelector('.solid-text');
      if (t) {
        try { t.focus({ preventScroll: true }); } catch (_) { try { t.focus(); } catch (_) {} }
        try { updateStatus(); } catch (_) {}
        return document.activeElement === t;
      }
      return false;
    }

    function render(focusIdx) {
      try { if (typeof hideNodeMenu === 'function') hideNodeMenu(); } catch (_) {}
      if (currentParentId && !graph.getNode(currentParentId)) currentParentId = null;
      pruneEmptiesToOne({ preserveCurrent: true });
      ensureLevelHasNode(currentParentId);
      const pages = clampPage();
      const vis = pages[page] || [];
      nodesEl.innerHTML = '';
      nodesEl.classList.toggle('show-4', vis.length === 4);
      vis.forEach((idx) => {
        nodesEl.appendChild(createNodeEl(idx));
      });
      // Pagers + row visibility owned by updateNav (v0.0.56 in-row pagers).
      updateNav();
      updateStatus();
      if (focusIdx !== undefined && vis.includes(focusIdx)) {
        const el = nodesEl.querySelector('.root-node[data-idx="' + focusIdx + '"]');
        if (el) {
          const input = el.querySelector('.root-input');
          if (input && input.classList.contains('show')) {
            autoGrow(input);
            input.focus();
          }
        }
      } else if (focusIdx === 'first-empty-visible') {
        focusFirstVisible();
      }
    }

    addBtn.addEventListener('click', () => {
      // Validation per level: only 1 empty waiting input at a time.
      const ordered = currentList();
      let emptyPos = -1;
      for (let i = 0; i < ordered.length; i++) {
        if (!isValidWord(ordered[i].word)) { emptyPos = i; break; }
      }
      if (emptyPos !== -1) {
        const pages = computePages(currentSize());
        for (let p = 0; p < pages.length; p++) {
          if (pages[p].includes(emptyPos)) { page = p; break; }
        }
        render(emptyPos);
        savePlace();
        const el = nodesEl.querySelector('.root-node[data-idx="' + emptyPos + '"]');
        const inp = el && el.querySelector('.root-input');
        if (inp) rejectEmpty(inp);
        return;
      }
      graph.addNode('', currentParentId);
      saveGraph();
      updateNav();
      const pages = computePages(currentSize());
      page = pages.length - 1;
      render(currentSize() - 1);
      savePlace();
    });
    if (homeBtn) homeBtn.addEventListener('click', () => navigateTo(null));
    if (levelBackBtn) levelBackBtn.addEventListener('click', goBack);
    const fontBtn = document.getElementById('font-btn');
    if (fontBtn) fontBtn.addEventListener('click', () => applyFont(fontIdx + 1));
    const spacingBtn = document.getElementById('spacing-btn');
    if (spacingBtn) spacingBtn.addEventListener('click', () => applySpacing(spacingIdx + 1));
    const leadingBtn = document.getElementById('leading-btn');
    if (leadingBtn) leadingBtn.addEventListener('click', () => applyLeading(leadingIdx + 1));
    const weightBtn = document.getElementById('weight-btn');
    if (weightBtn) weightBtn.addEventListener('click', () => applyWeight(weightIdx + 1));
    const sizeBtn = document.getElementById('size-btn');
    if (sizeBtn) sizeBtn.addEventListener('click', () => applySize(sizeIdx + 1));
    // Style knobs collapse (v0.0.60): #style-toggle expands/collapses the
    // #style-knobs row (font/spacing/leading/weight/size). Default collapsed,
    // persisted in 'style-knobs-open' ('1' open, else closed). Simple show/hide.
    const LS_KNOBS = 'style-knobs-open';
    const knobsEl = document.getElementById('style-knobs');
    const styleToggle = document.getElementById('style-toggle');
    function setKnobsOpen(open, silent) {
      const v = !!open;
      try {
        if (knobsEl) knobsEl.classList.toggle('open', v);
        if (styleToggle) styleToggle.setAttribute('aria-expanded', v ? 'true' : 'false');
        if (!silent) { try { localStorage.setItem(LS_KNOBS, v ? '1' : '0'); } catch (_) {} }
      } catch (_) {}
    }
    let knobsOpen = false;
    try { knobsOpen = localStorage.getItem(LS_KNOBS) === '1'; } catch (_) {}
    setKnobsOpen(knobsOpen, true);
    if (styleToggle) styleToggle.addEventListener('click', () => {
      knobsOpen = !(knobsEl && knobsEl.classList.contains('open'));
      setKnobsOpen(knobsOpen);
    });
    if (crumbToggleBtn) crumbToggleBtn.addEventListener('click', (e) => {
      try { e.stopPropagation(); } catch (_) {}
      setCrumbsVisible(!crumbsVisible);
    });
    // Floating menu dismiss (v0.0.51): outside click / Esc closes, crumb click
    // navigates + closes via navigateTo (crumbsVisible=false).
    document.addEventListener('click', (e) => {
      if (!crumbsVisible) return;
      try {
        if (crumbsEl && crumbsEl.contains(e.target)) return;
        if (crumbToggleBtn && crumbToggleBtn.contains(e.target)) return;
      } catch (_) {}
      setCrumbsVisible(false);
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && crumbsVisible) setCrumbsVisible(false);
    });
    window.addEventListener('resize', () => { if (crumbsVisible) positionCrumbMenu(); });
    pageUp.addEventListener('click', () => {
      if (page > 0) { page--; render(); savePlace(); }
    });
    pageDown.addEventListener('click', () => {
      const pages = computePages(currentSize());
      if (page < pages.length - 1) { page++; render(); savePlace(); }
    });

    // Node context menu (v0.0.80 hold menu, v0.0.81 two-step cascade): long-press/hold
    // (~450ms pointerdown without move) or right-click on .root-node shows a
    // small floating #node-menu anchored on the node with a mono ghost trash
    // button (bin icon + Trash). Click trash -> trashLeafFromMenu(id): any
    // childless leaf trashes even with a word (single-click, keeps
    // id/word/body/parentId via trashNode); parent with children first
    // refuses with shake + "Can't trash: has N children. Click again..."
    // and arms confirm ~4s ("Trash all N?" + .danger, menu stays open),
    // second click cascades via trashCascade (trash flag subtree, keep
    // words/parent links). Works for solid + input states, mouse + touch
    // via pointer events; normal click-to-edit/arrows untouched (hold cancels
    // on move/up, post-hold click suppressed via capture). Dismiss + disarm
    // on outside click/Esc/timeout/scroll/resize/render. No drag exists.
    // v0.0.87: menu also has Share (menu-share -> shareNode, URL hash link).
    let menuNodeId = null;
    let holdTimer = null;
    let holdStartX = 0;
    let holdStartY = 0;
    let holdNodeEl = null;
    let holdNodeId = null;
    let suppressNodeClick = false;
    function nodeIdForEl(nodeEl) {
      if (!nodeEl) return null;
      let nid = (nodeEl.dataset && nodeEl.dataset.nodeId) || null;
      if (nid && graph.getNode(nid)) return nid;
      const gi = Number(nodeEl.dataset ? nodeEl.dataset.idx : NaN);
      if (Number.isFinite(gi)) {
        const alt = nodeIdAt(gi);
        if (alt && graph.getNode(alt)) return alt;
      }
      return nid || null;
    }
    function isNodeMenuOpen() {
      try {
        const m = document.getElementById('node-menu');
        return !!(menuNodeId && m && m.style.display !== 'none');
      } catch (_) { return false; }
    }
    function positionNodeMenu(anchorRect) {
      try {
        const menu = document.getElementById('node-menu');
        if (!menu || !anchorRect) return;
        if (menu.style.display === 'none') return;
        const mw = menu.offsetWidth || 140;
        const mh = menu.offsetHeight || 36;
        let left = Math.round(anchorRect.left + anchorRect.width / 2 - mw / 2);
        left = Math.max(8, Math.min(left, window.innerWidth - mw - 8));
        let top = Math.round(anchorRect.bottom + 8);
        if (top + mh > window.innerHeight - 8) top = Math.round(anchorRect.top - mh - 8);
        if (top < 8) top = Math.max(8, window.innerHeight - mh - 8);
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
      } catch (_) {}
    }
    // Two-step confirm cascade (v0.0.81): first Trash click on a node with
    // active descendants shakes + warns + arms confirm for that id ~4s
    // (button label -> "Trash all N?" + .danger, menu stays open); second
    // click within window cascades via trashCascade. Click elsewhere / Esc /
    // timeout / new menu / hide disarms (button back to "Trash").
    let confirmTrashId = null;
    let confirmTrashTimer = null;
    let confirmTrashN = 0;
    function trashBtnEls() {
      try {
        const btn = document.getElementById('node-menu-trash');
        const labelEl = btn ? btn.querySelector('span') : null;
        return { btn, labelEl };
      } catch (_) { return { btn: null, labelEl: null }; }
    }
    function setTrashBtnNormal(nd) {
      const { btn, labelEl } = trashBtnEls();
      if (!btn) return;
      try { btn.classList.remove('danger'); } catch (_) {}
      try { if (labelEl) labelEl.textContent = 'Trash'; } catch (_) {}
      const label = (nd && (nd.word || '').trim()) || 'node';
      try { btn.setAttribute('aria-label', 'Trash ' + label); } catch (_) {}
      try { btn.title = 'Trash ' + label; } catch (_) {}
    }
    function armTrashConfirm(nid, n) {
      disarmTrashConfirm();
      confirmTrashId = nid;
      confirmTrashN = n;
      const { btn, labelEl } = trashBtnEls();
      if (btn) {
        try { btn.classList.add('danger'); } catch (_) {}
        try { if (labelEl) labelEl.textContent = 'Trash all ' + n + '?'; } catch (_) {}
        try { btn.setAttribute('aria-label', 'Trash all ' + n + ' with children'); } catch (_) {}
        try { btn.title = 'Trash all ' + n + ' with children'; } catch (_) {}
      }
      confirmTrashTimer = setTimeout(() => {
        confirmTrashTimer = null;
        const stillArmed = confirmTrashId;
        disarmTrashConfirm();
        if (stillArmed && isNodeMenuOpen()) { try { updateStatus(); } catch (_) {} }
      }, 4000);
    }
    function disarmTrashConfirm() {
      if (confirmTrashTimer) { try { clearTimeout(confirmTrashTimer); } catch (_) {} confirmTrashTimer = null; }
      confirmTrashId = null;
      confirmTrashN = 0;
      try {
        const nd = menuNodeId ? graph.getNode(menuNodeId) : null;
        setTrashBtnNormal(nd || undefined);
      } catch (_) {
        try {
          const { btn, labelEl } = trashBtnEls();
          if (btn) btn.classList.remove('danger');
          if (labelEl) labelEl.textContent = 'Trash';
        } catch (_) {}

        try { location.hash = ''; } catch (_) {}
      }
      try { navigateTo(null); } catch (_) {}
    }
    function stepShared(dir) {
      const total = sharedPageCount();
      const next = sharedPageIdx + dir;
      if (next < 0 || next > total - 1) return;
      sharedPageIdx = next;
      renderSharedPage();
    }
    // Returns true when a shared view opened, 'invalid' when #s= present
    // but unparseable (status set, otherwise ignored), false when no hash.
    function checkShareHash() {
      let h = '';
      try { h = location.hash || ''; } catch (_) { h = ''; }
      if (h.slice(0, 3) !== '#s=') return false;
      const b64 = h.slice(3);
      if (!b64) return false;
      let obj = null;
      try { obj = shareDecode(b64); }
      catch (_) { obj = null; }
      if (!obj) { try { status.textContent = 'Invalid share link'; } catch (_) {} return 'invalid'; }
      try {
        if (openShared(obj)) return true;
      } catch (_) {}
      try { status.textContent = 'Invalid share link'; } catch (_) {}
      return 'invalid';
    }
    (function wireShared() {
      const r = document.getElementById('shared');
      const closeBtn = document.getElementById('shared-close');
      const prevBtn = document.getElementById('shared-prev');
      const nextBtn = document.getElementById('shared-next');
      if (closeBtn) closeBtn.addEventListener('click', (e) => { try { e.stopPropagation(); } catch (_) {} closeShared(); });
      if (prevBtn) prevBtn.addEventListener('click', (e) => { try { e.stopPropagation(); } catch (_) {} stepShared(-1); });
      if (nextBtn) nextBtn.addEventListener('click', (e) => { try { e.stopPropagation(); } catch (_) {} stepShared(1); });
      if (r) r.addEventListener('click', (e) => { try { if (e.target === r) closeShared(); } catch (_) {} });
      window.addEventListener('keydown', (e) => {
        if (!isSharedOpen()) return;
        if (e.key === 'Escape') { e.preventDefault(); try { e.stopPropagation(); } catch (_) {} closeShared(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); try { e.stopPropagation(); } catch (_) {} stepShared(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); try { e.stopPropagation(); } catch (_) {} stepShared(1); }
      }, true);
      window.addEventListener('hashchange', () => {
        try {
          const h = location.hash || '';
          if (h.slice(0, 3) === '#s=') { checkShareHash(); return; }
          if (isSharedOpen()) {
            const rr = document.getElementById('shared');
            if (rr) rr.style.display = 'none';
            sharedRoot = null;
          }
        } catch (_) {}
      });
    })();

    // Keyboard up/down navigation (v0.0.30): moves focus across nodes in the
    // current level, turning pages as needed. Scoped to currentParentId via
    // currentList()/computePages(). Typing is never hijacked: arrows inside a
    // non-empty input keep caret behavior; an empty waiting input still moves
    // (no caret to protect, keeps Down->node2 working after landing on an
    // empty node1). Solids are tabindex=0 so they can receive focus.
    function focusableForNodeEl(el) {
      if (!el) return null;
      const input = el.querySelector('.root-input');
      const wrap = el.querySelector('.solid-wrap');
      const solid = el.querySelector('.solid-text');
      if (input && (input.classList.contains('show') || input.classList.contains('edit-pop'))) return input;
      if (solid && wrap && wrap.classList.contains('show')) return solid;
      return input || solid;
    }
    function pageForPos(pages, pos) {
      for (let p = 0; p < pages.length; p++) {
        if (pages[p].indexOf(pos) !== -1) return p;
      }
      return 0;
    }
    // Focus by node id (not bare index): blurring an empty waiting input
    // during render/focus can auto-prune it (existing validation), shifting
    // indices — id resolve + retry keeps focus on the intended node.
    function focusById(targetId, fallbackPos) {
      for (let attempt = 0; attempt < 3; attempt++) {
        const fresh = currentList();
        if (fresh.length === 0) return false;
        let fp = targetId ? fresh.findIndex((n) => n.id === targetId) : -1;
        if (fp === -1) fp = Math.max(0, Math.min(fallbackPos, fresh.length - 1));
        const pg = pageForPos(computePages(fresh.length), fp);
        if (pg !== page) { page = pg; render(); savePlace(); continue; }
        const el = nodesEl.querySelector('.root-node[data-idx="' + fp + '"]');
        const t = focusableForNodeEl(el);
        if (!t) { render(); continue; }
        try { t.focus({ preventScroll: true }); } catch (_) { t.focus(); }
        if (document.activeElement === t) {
          updateStatus();
          return true;
        }
        // Focus lost to a blur-triggered prune+render; retry by id.
      }
      return false;
    }
    function stepFocus(dir) {
      const list = currentList();
      if (list.length === 0) return;
      const ae = document.activeElement;
      const nodeEl = ae && ae.closest ? ae.closest('.root-node') : null;
      let curPos = -1;
      if (nodeEl && nodesEl.contains(nodeEl)) {
        const cid = nodeEl.dataset ? nodeEl.dataset.nodeId : null;
        curPos = cid ? list.findIndex((n) => n.id === cid) : -1;
        if (curPos === -1) {
          const gi = Number(nodeEl.dataset ? nodeEl.dataset.idx : NaN);
          curPos = Number.isFinite(gi) && gi >= 0 && gi < list.length ? gi : -1;
        }
      }
      let targetPos;
      if (curPos === -1) {
        targetPos = dir > 0 ? 0 : list.length - 1;
      } else {
        targetPos = curPos + dir;
        if (targetPos < 0 || targetPos >= list.length) return;
      }
      const targetId = list[targetPos] ? list[targetPos].id : null;
      focusById(targetId, targetPos);
    }
    // Keyboard Left back (v0.0.35, v0.0.84 parent-focus): ArrowLeft inside drills up via goBack(),
    // same as bottom ‹ back button (goBack forwards the exited id as focusId
    // so the parent level focuses the node just exited). At root does nothing. Same typing guard
    // as up/down/right: non-empty inputs keep caret behavior.
    // Keyboard Right drill (v0.0.34): ArrowRight on a focused node drills
    // inside via navigateTo(id), same as clicking ›. Only solids with a word
    // drill; empty waiting boxes do nothing (shake for feedback). Outside the
    // list does nothing. Same typing guard as up/down: non-empty inputs keep
    // caret behavior.
    function openFocusedNode() {
      const ae = document.activeElement;
      const nodeEl = ae && ae.closest ? ae.closest('.root-node') : null;
      if (!nodeEl || !nodesEl.contains(nodeEl)) return;
      let nid = (nodeEl.dataset && nodeEl.dataset.nodeId) || null;
      if (!nid || !graph.getNode(nid)) {
        const gi = Number(nodeEl.dataset ? nodeEl.dataset.idx : NaN);
        nid = Number.isFinite(gi) ? nodeIdAt(gi) : undefined;
      }
      const nd = nid ? graph.getNode(nid) : null;
      if (!nd) return;
      if (!((nd.word || '').trim())) {
        const inp = nodeEl.querySelector('.root-input');
        if (inp && (inp.classList.contains('show') || inp.classList.contains('edit-pop'))) shakeInput(inp);
        return;
      }
      navigateTo(nid);
    }
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      try { if (typeof isReaderOpen === 'function' && isReaderOpen()) return; } catch (_) {}
      try { if (typeof isSharedOpen === 'function' && isSharedOpen()) return; } catch (_) {}
      if (e.altKey || e.metaKey || e.ctrlKey) return;
      const t = e.target;
      if (t && t.tagName === 'TEXTAREA') {
        if (t.classList && t.classList.contains('root-input')) {
          if (String(t.value || '').trim() !== '') return;
        } else return;
      }
      if (t && t.tagName === 'INPUT') {
        if (String(t.value || '').trim() !== '') return;
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (currentParentId != null) goBack(); // v0.0.84: parent-focus via focusId
        return;
      }
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        openFocusedNode();
        return;
      }
      e.preventDefault();
      stepFocus(e.key === 'ArrowDown' ? 1 : -1);
    });

    // '+' add shortcut (v0.0.49): '+' or '=' (shift+=) triggers addBtn.click()
    // (same single-waiting validation, jump to last page, focus new). Guard
    // like arrows: non-empty INPUT/TEXTAREA keeps typed '+'; empty waiting
    // input preventDefaults (no '+' char) and reuses button flow (focus+shake
    // existing empty instead of dup).
    window.addEventListener('keydown', (e) => {
      if (e.key !== '+' && e.key !== '=') return;
      try { if (typeof isReaderOpen === 'function' && isReaderOpen()) return; } catch (_) {}
      try { if (typeof isSharedOpen === 'function' && isSharedOpen()) return; } catch (_) {}
      if (e.altKey || e.metaKey || e.ctrlKey) return;
      const t = e.target;
      if (t && t.tagName === 'TEXTAREA') {
        if (t.classList && t.classList.contains('root-input')) {
          if (String(t.value || '').trim() !== '') return;
        } else return;
      }
      if (t && t.tagName === 'INPUT') {
        if (String(t.value || '').trim() !== '') return;
      }
      e.preventDefault();
      try { addBtn.click(); } catch (_) {}
    });

    window.addEventListener('resize', () => {
      try {
        nodesEl.querySelectorAll('.root-input.show, .root-input.edit-pop').forEach(autoGrow);
        if (typeof nodeBody !== 'undefined' && nodeBody && nodeBody.style.display !== 'none') autoGrow(nodeBody);
      } catch (_) {}
    });

    // Add-node button bounce: newborn exploring within 3px radius every ~800ms.
    setInterval(() => {
      const x = (Math.random() * 6 - 3).toFixed(2);
      const y = (Math.random() * 6 - 3).toFixed(2);
      addBtn.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    }, 800);

    // Init: graph drives center. Migrate legacy keys if present.
    // loadNodes restores saved parent/page (v0.0.32, validated); no reset.
    loadNodes();
    clampPage();
    render('first-empty-visible');
    // Autofocus first node on load (v0.0.48): waiting input, else first solid.
    // v0.0.87: check #s= share hash first — shared view opens on top of own
    // roots (untouched); invalid keeps "Invalid share link" (no overwrite).
    requestAnimationFrame(() => {
      let shr = false;
      try { shr = checkShareHash(); } catch (_) {}
      if (shr === true) return;
      focusFirstVisible();
      if (shr !== 'invalid') updateStatus();
    });
  </script>
  <script>
    // Keys tip (v0.0.71, v0.0.73 ? key): "?" button or "?" key (shift+/) toggles floating shortcut card; outside click / Esc dismisses.
    (() => {
      const btn = document.getElementById('keys-tip-btn');
      const card = document.getElementById('keys-tip-card');
      if (!btn || !card) return;
      let open = false;
      function setOpen(v) {
        open = !!v;
        card.style.display = open ? '' : 'none';
        try { btn.setAttribute('aria-expanded', open ? 'true' : 'false'); } catch (_) {}
      }
      // v0.0.73: global "?" key toggles like the button; same guard as "+"
      // (v0.0.49): non-empty INPUT/TEXTAREA keeps typed "?"; empty waiting
      // input preventDefaults (no "?" char) and toggles.
      function isTypingNonEmpty(t) {
        if (t && t.tagName === 'TEXTAREA') {
          if (t.classList && t.classList.contains('root-input')) {
            if (String(t.value || '').trim() !== '') return true;
          } else return true;
        }
        if (t && t.tagName === 'INPUT') {
          if (String(t.value || '').trim() !== '') return true;
        }
        return false;
      }
      btn.addEventListener('click', (e) => {
        try { e.stopPropagation(); } catch (_) {}
        setOpen(!open);
      });
      document.addEventListener('click', (e) => {
        if (!open) return;
        try {
          if (card.contains(e.target)) return;
          if (btn.contains(e.target)) return;
        } catch (_) {}
        setOpen(false);
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && open) setOpen(false);
      });
      window.addEventListener('keydown', (e) => {
        if (e.key !== '?') return;
        if (e.altKey || e.metaKey || e.ctrlKey) return;
        if (isTypingNonEmpty(e.target)) return;
        e.preventDefault();
        setOpen(!open);
      });
    })();
  </script>
  <script>
    // Alt-key element ID peek: hold Alt to show badges with friendly IDs.
    // Click a badge to copy its ID; release Alt or press Esc to hide.
    (() => {
      let badges = [];
      let visible = false;
      function isVisibleEl(el) {
        if (!el) return false;
        const cs = getComputedStyle(el);
        if (cs.display === 'none' || cs.visibility === 'hidden') return false;
        const r = el.getBoundingClientRect();
        return r.width > 0 && r.height > 0;
      }
      function collectTargets() {
        const out = [];
        const push = (el, id) => { if (el && isVisibleEl(el)) out.push({ el, id }); };
        push(document.getElementById('round-btn'), 'write-btn');
        push(document.getElementById('stage'), 'stage');
        push(document.getElementById('level-title'), 'level-title');
        push(document.getElementById('node-body'), 'node-body');
        push(document.getElementById('page-up'), 'page-up');
        push(document.getElementById('page-down'), 'page-down');
        push(document.getElementById('add-node-btn'), 'add-btn');
        push(document.getElementById('style-toggle'), 'style-toggle');
        push(document.getElementById('font-btn'), 'font-btn');
        push(document.getElementById('spacing-btn'), 'spacing-btn');
        push(document.getElementById('leading-btn'), 'leading-btn');
        push(document.getElementById('weight-btn'), 'weight-btn');
        push(document.getElementById('size-btn'), 'size-btn');
        push(document.getElementById('home-btn'), 'home-btn');
        push(document.getElementById('level-back-btn'), 'back-btn');
        push(document.getElementById('crumb-toggle-btn'), 'crumb-toggle-btn');
        push(document.getElementById('status'), 'status');
        push(document.getElementById('version-inline'), 'version-inline');
        push(document.getElementById('keys-tip-btn'), 'keys-tip-btn');
        document.querySelectorAll('#crumbs .crumb-btn').forEach((b) => {
          push(b, 'crumb-' + (b.dataset.crumb || '0'));
        });
        document.querySelectorAll('.root-node').forEach((nodeEl) => {
          const idx = nodeEl.dataset.idx || '0';
          push(nodeEl.querySelector('.root-input'), 'node-' + idx + '-box');
          push(nodeEl.querySelector('.solid-text'), 'node-' + idx + '-text');
          push(nodeEl.querySelector('.open-btn'), 'open-node-' + idx);
        });
        push(document.getElementById('node-menu-trash'), 'node-menu-trash');
        push(document.getElementById('menu-read'), 'menu-read');
        push(document.getElementById('menu-share'), 'menu-share');
        push(document.getElementById('reader'), 'reader');
        push(document.getElementById('reader-close'), 'reader-close');
        push(document.getElementById('reader-prev'), 'reader-prev');
        push(document.getElementById('reader-next'), 'reader-next');
        push(document.getElementById('shared'), 'shared');
        push(document.getElementById('shared-close'), 'shared-close');
        push(document.getElementById('shared-prev'), 'shared-prev');
        push(document.getElementById('shared-next'), 'shared-next');
        return out;
      }
      function showPeek() {
        if (visible) return;
        visible = true;
        hidePeek(true);
        visible = true;
        for (const { el, id } of collectTargets()) {
          const r = el.getBoundingClientRect();
          const b = document.createElement('div');
          b.className = 'id-badge';
          b.textContent = id;
          b.dataset.peekId = id;
          let top = r.top - 22;
          if (top < 4) top = r.bottom + 4;
          b.style.top = Math.round(top) + 'px';
          b.style.left = Math.round(Math.max(4, r.left)) + 'px';
          b.addEventListener('mousedown', (e) => e.preventDefault());
          b.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            try { navigator.clipboard.writeText(id); } catch (_) {}
            b.textContent = 'copied';
            b.classList.add('copied');
            setTimeout(() => {
              if (b.isConnected) {
                b.textContent = id;
                b.classList.remove('copied');
              }
            }, 800);
          });
          document.body.appendChild(b);
          badges.push(b);
        }
      }
      function hidePeek(keepFlag) {
        for (const b of badges) b.remove();
        badges = [];
        if (!keepFlag) visible = false;
      }
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Alt' && !e.repeat) {
          e.preventDefault();
          showPeek();
        } else if (e.key === 'Escape' && visible) {
          hidePeek();
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'Alt') { e.preventDefault(); hidePeek(); }
      });
      window.addEventListener('blur', () => hidePeek());
      window.addEventListener('resize', () => { if (visible) showPeekRefresh(); });
      function showPeekRefresh() {
        const was = visible;
        hidePeek(true);
        visible = false;
        if (was) showPeek();
      }
    })();
  </script>
  <script>
    // Dev hot reload: poll HEAD every 1s, reload if Last-Modified/ETag/length changed.
    (() => {
      const url = location.pathname;
      const keyOf = (h) =>
        (h.get('last-modified') || '') + '|' +
        (h.get('content-length') || '') + '|' +
        (h.get('etag') || '');
      let last = null;
      async function poll() {
        try {
          const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
          const k = keyOf(r.headers);
          if (last === null) { last = k; return; }
          if (k !== last) location.reload();
        } catch (_) {}
      }
      poll().then(() => setInterval(poll, 1000));
    })();
  </script>
  <script>
    // PWA (v0.0.85): register service worker for installability + offline shell.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
